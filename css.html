<style>
:root{
  --paper:#f1e7d0; --paper2:#e8dabb; --ink:#2a2420; --ink2:#5b4f45; --mute:#8b7c6b;
  --red:#a8322a; --red2:#c2493c; --gold:#a07a3c; --jade:#3e6a5a; --wood:#4e3220; --line:#cdbb98;
  --f-title:'LXGW WenKai TC','Noto Serif TC','標楷體',serif;
  --f-body:'Noto Serif TC','PMingLiU','新細明體',serif;
  --fs:18px; --lh:2.05; --read-font:var(--f-body);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--f-body);color:var(--ink);background:var(--paper);
  background-image:
    radial-gradient(ellipse at 15% 10%,rgba(255,250,235,.8),transparent 55%),
    radial-gradient(ellipse at 85% 90%,rgba(170,130,70,.18),transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-attachment:fixed;
}
button{font-family:var(--f-title);cursor:pointer}
input,select{font-family:var(--f-body)}
.hidden{display:none!important}

/* ---------- 頂欄 ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 22px;background:linear-gradient(#5a3a25,#3f2717);color:#f3e6c8;
  box-shadow:0 3px 0 #2c1a0f,0 6px 18px rgba(0,0,0,.25);border-bottom:2px solid #b08a4a}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer}
.seal{width:46px;height:46px;flex:none;background:var(--red);color:#fbeee0;border-radius:6px;
  display:grid;place-items:center;font:700 17px/1 var(--f-title);writing-mode:vertical-rl;letter-spacing:2px;
  box-shadow:inset 0 0 0 2px #fbeee0,inset 0 0 0 4px var(--red);transform:rotate(-3deg)}
.brand h1{margin:0;font:700 24px/1.2 var(--f-title);letter-spacing:4px}
.brand small{font:14px var(--f-title);opacity:.75;letter-spacing:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tbtn{white-space:nowrap;flex:none;background:transparent;border:1px solid #b08a4a;color:#f3e6c8;border-radius:999px;padding:5px 13px;font-size:15px}
.tbtn:hover{background:rgba(255,235,200,.12)}
.tbtn.on{background:#b08a4a;color:#2c1a0f}
.who{font:15px var(--f-title);opacity:.9;margin:0 4px}

main{max-width:1320px;margin:0 auto;padding:26px 20px 80px}

/* ---------- 卷軸面板 ---------- */
.scrollpanel{position:relative;background:#f8f1df;border:1px solid var(--line);border-radius:4px;
  box-shadow:0 1px 0 #fff inset,0 12px 30px rgba(80,50,20,.18);padding:30px 34px}
.scrollpanel:before,.scrollpanel:after{content:"";position:absolute;left:-10px;right:-10px;height:16px;
  background:linear-gradient(#6b4529,#3e2616);border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.scrollpanel:before{top:-10px}.scrollpanel:after{bottom:-10px}

/* ---------- 登入 ---------- */
.loginwrap{max-width:560px;margin:30px auto}
.poemline{text-align:center;font:20px/2 var(--f-title);color:var(--ink2);letter-spacing:6px;margin:0 0 6px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:18px 0 20px}
.tab{flex:1;background:none;border:none;padding:10px 4px;font-size:18px;color:var(--mute);border-bottom:3px solid transparent}
.tab.on{color:var(--red);border-color:var(--red)}
.field{margin:0 0 14px}
.field label{display:block;font:15px var(--f-title);color:var(--ink2);margin-bottom:5px}
.field input{width:100%;padding:11px 12px;font-size:17px;border:1px solid var(--line);border-radius:3px;background:#fffaf0}
.field input:focus{outline:2px solid rgba(168,50,42,.35);border-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:var(--red);color:#fbeee0;border:none;border-radius:3px;padding:11px 22px;font-size:18px;letter-spacing:3px;
  box-shadow:0 3px 0 #6e1d17}
.btn:hover{background:var(--red2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6e1d17}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red);box-shadow:none}
.btn.jade{background:var(--jade);box-shadow:0 3px 0 #23413a}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:wait}
.note{font-size:14px;color:var(--mute);line-height:1.7}
.err{color:var(--red);font-size:15px;min-height:1.4em;margin:6px 0}

/* ---------- 目錄 ---------- */
.homehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 26px;flex-wrap:wrap}
.homehead h2{margin:0;font:700 30px var(--f-title);letter-spacing:6px}
.homehead p{margin:4px 0 0;color:var(--ink2)}
.stat{display:flex;gap:18px}
.stat div{text-align:center;font-family:var(--f-title)}
.stat b{display:block;font-size:28px;color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.card{position:relative;height:370px;background:linear-gradient(90deg,#efe2c3,#f8f0dc 20%,#f8f0dc 80%,#ead9b4);
  border:1px solid var(--line);border-radius:3px;box-shadow:0 8px 18px rgba(80,50,20,.16);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;padding:16px 8px 12px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 26px rgba(80,50,20,.24)}
.card .no{font:700 16px var(--f-title);color:#fbeee0;background:var(--wood);padding:3px 12px;border-radius:2px;letter-spacing:3px}
.card .vt{flex:1;align-self:center;margin-top:16px;writing-mode:vertical-rl;direction:ltr;text-orientation:upright;
  font:21px/1.3 var(--f-title);letter-spacing:5px;white-space:nowrap}
.card .vt span{display:block;margin-left:14px}
.card .st{font-size:14px;color:var(--mute);font-family:var(--f-title);align-self:flex-end;margin-right:4px}
.card .st.c{align-self:center;margin-right:0}
.card .stamp{position:absolute;left:10px;bottom:10px;width:50px;height:50px;border:2px solid var(--red);color:var(--red);
  border-radius:50%;display:grid;place-items:center;font:700 15px/1.1 var(--f-title);text-align:center;transform:rotate(-14deg);
  background:rgba(255,245,235,.6)}
.card.locked{opacity:.55;filter:grayscale(.6);cursor:not-allowed}
.card.locked:hover{transform:none}
.guestbox{margin:14px 0 4px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.guestbox .note{text-align:center;margin:8px 0 0}
.card .stamp.draft{border-color:var(--gold);color:var(--gold);border-radius:4px}

/* ---------- 閱讀頁 ---------- */
.rhead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.chno{font:700 18px var(--f-title);color:#fbeee0;background:var(--red);padding:6px 14px;border-radius:2px;letter-spacing:4px}
.couplet{margin:0;font:700 26px/1.4 var(--f-title);letter-spacing:5px;display:flex;gap:28px;flex-wrap:wrap}
.rtools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#f8f0dc;border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:15px}
.chip.on{background:var(--wood);color:#f3e6c8;border-color:var(--wood)}
main:has(.reader){padding-bottom:14px}
.reader{display:flex;flex-direction:column;height:calc(100vh - 118px);min-height:460px}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);gap:26px}
.cols>.scrollpanel{height:100%;min-height:0;border-top:9px solid var(--wood);border-bottom:9px solid var(--wood);border-radius:3px}
.cols>.scrollpanel:before,.cols>.scrollpanel:after{display:none}
.text{overflow:auto;font-size:var(--fs);line-height:var(--lh);font-family:var(--read-font);text-align:justify;padding:34px 40px}
.text p{position:relative;margin:0 0 1.1em;text-indent:2em;transition:background 1.2s}
.text p.bm:before{content:"";position:absolute;left:-26px;top:.35em;width:12px;height:26px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.text.vert p.bm:before{left:auto;right:.2em;top:-22px;width:26px;height:12px;clip-path:polygon(0 0,100% 0,75% 50%,100% 100%,0 100%)}
.text .poemgrp p.poem, .text p.quote{font-family:var(--read-font)}
.rhead{position:relative}
.pop{position:absolute;right:0;top:100%;margin-top:8px;z-index:30;width:min(380px,92vw);background:#fbf5e6;border:1px solid var(--line);border-top:6px solid var(--wood);
  border-radius:3px;box-shadow:0 14px 30px rgba(60,35,15,.28);padding:16px 18px;font-size:15px}
.pop h5{margin:2px 0 8px;font:700 15px var(--f-title);color:var(--wood);letter-spacing:2px}
.pop .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pop .chip{font-size:14px}
.pop input[type=range]{width:100%;accent-color:var(--red)}
.pop .preview{border:1px dashed var(--line);padding:10px 12px;line-height:var(--lh);font-family:var(--read-font);font-size:var(--fs);background:#fffaf0}
.bmlist{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
.bmlist li{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.bmlist li:hover{background:rgba(160,122,60,.1)}
.bmlist .n{flex:none;font:700 13px var(--f-title);color:#fff;background:var(--red);padding:1px 7px;border-radius:2px}
.bmlist .s{flex:1;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmlist .x{flex:none;background:none;border:none;color:var(--mute);font-size:18px;padding:0 4px}
.bmempty{color:var(--mute);font-size:14px;margin:4px 0 0}
.text .poemgrp{margin:0 0 1.5em;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.text p.poem{text-indent:0;text-align:center;font-family:var(--f-title);font-size:1.08em;line-height:2;color:var(--ink2);margin:0}
.text p.quote{text-indent:0;margin:0 2em 1.3em;padding:12px 18px;font-family:var(--f-title);color:var(--ink2);background:rgba(160,122,60,.08);border-left:3px solid var(--gold)}
.text .source{writing-mode:horizontal-tb;margin-top:1.4em;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;line-height:1.8;color:var(--mute);text-indent:0}
.text .source a{color:var(--red)}
.text.vert p.quote{margin:2em 0 0 1.3em;border-left:none;border-top:3px solid var(--gold)}
/* 註釋與人物 */
.text .nt{border-bottom:1.5px dotted var(--red);cursor:help}
.text .ps{color:#6b3a1e;cursor:pointer}
/* 專名號：人名、地名、朝代、年號加直線；書名加波浪線。相鄰專名之間留空隙 */
.text .zm,.preview .zm{background:linear-gradient(currentColor,currentColor) no-repeat 50% 100%/calc(100% - 4px) 1px}
.text.vert .zm{background-position:0 50%;background-size:1px calc(100% - 4px)}
.text .zm.bk{background:none;text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:.32em}
.text.vert .zm.bk{text-underline-position:left}
.text .zm.pk{cursor:help}
.pnoff .text .zm,.pnoff .preview .zm{background:none}
.pnoff .text .zm.bk{text-decoration:none}
.pnoff .text .ps{border-bottom:1px solid rgba(107,58,30,.25)}
/* 選字小工具 */
#selbar{position:fixed;z-index:60;display:none;gap:6px;background:var(--wood);padding:6px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#selbar.show{display:flex}
#selbar a,#selbar button{font:14px var(--f-title);color:#f3e6c8;background:transparent;border:1px solid rgba(243,230,200,.4);border-radius:4px;padding:5px 10px;text-decoration:none;white-space:nowrap;cursor:pointer}
#selbar a:hover,#selbar button:hover{background:rgba(243,230,200,.15)}
.text .zm.pk:hover,.text .nt:hover,.text .ps:hover{background:rgba(214,170,80,.25)}
#tip{position:fixed;z-index:70;display:none;background:#fbf5e6;border:1px solid var(--line);border-top:6px solid var(--red);border-radius:3px;
  box-shadow:0 14px 30px rgba(60,35,15,.3);padding:14px 16px 12px;font-size:15px;line-height:1.7;max-height:60vh;overflow:auto}
#tip.show{display:block}
#tip .tipx{position:absolute;right:6px;top:2px;background:none;border:none;font-size:20px;color:var(--mute)}
#tip .tiph{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;padding-right:18px}
#tip .tiph b{font:700 20px var(--f-title)}
#tip .zy{font-size:14px;color:var(--red);letter-spacing:1px}
#tip .camp{font:13px var(--f-title);background:var(--jade);color:#fff;padding:0 8px;border-radius:2px}
#tip .tipa{font-size:13px;color:var(--mute)}
#tip .tipd{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
#tip .tipd b{font:700 14px var(--f-title);color:var(--wood)}
#tip .tipd p{margin:4px 0;font-size:14px}
#tip .tipd p span{display:inline-block;font:12px var(--f-title);color:#fff;background:var(--wood);padding:0 6px;margin-right:6px;border-radius:2px}
/* 進度與成就 */
.progress{margin:0 0 26px;padding:18px 22px}
.pg-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--mute)}
.pg-top b{font:700 17px var(--f-title);color:var(--wood);letter-spacing:2px}
.pg-bar{height:8px;background:#e6d6b2;border-radius:4px;margin:8px 0 12px;overflow:hidden}
.pg-bar div{height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.pg-nodes{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.pg-nodes i{width:22px;height:2px;background:var(--line)}
.node{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-title);border:2px solid var(--line);color:var(--mute);background:#fffaf0}
.node.draft{border-color:var(--gold);color:var(--gold)}
.node.done{background:var(--red);border-color:var(--red);color:#fff}
.node.perfect{box-shadow:0 0 0 3px rgba(214,170,80,.6)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin-top:10px}
.ach{text-align:center;cursor:pointer;opacity:.35;filter:grayscale(1)}
.ach.got{opacity:1;filter:none}
.ach .seal2{display:inline-grid;place-items:center;width:52px;height:52px;border:2.5px solid var(--red);color:var(--red);border-radius:6px;font:700 18px/1.05 var(--f-title);
  writing-mode:vertical-rl;letter-spacing:2px;transform:rotate(-5deg);background:rgba(255,245,235,.7)}
.ach.got .seal2{background:var(--red);color:#fbeee0}
.ach small{display:block;margin-top:6px;font:13px var(--f-title);color:var(--ink2)}
/* 錯題本 */
.mlist{display:grid;gap:18px}
.mq{padding:20px 24px}
.mq.fixed{opacity:.75}
.chno.sm{font-size:13px;padding:2px 8px;letter-spacing:2px}
.okmark{margin-left:auto;font:700 13px var(--f-title);color:var(--jade);border:1.5px solid var(--jade);padding:0 8px;border-radius:2px}
.mbar{display:flex;align-items:center;gap:12px;margin-top:8px}
.mq .opt.wrong{text-decoration:none}
/* 回末小結 */
.summ{margin:12px 0 4px;padding:16px 18px;background:#fffaf0;border:1px solid var(--line);border-left:5px solid var(--red)}
.summ-h{font:700 18px var(--f-title);color:var(--red);letter-spacing:3px;margin-bottom:6px}
.summ ol{margin:0 0 10px;padding-left:1.4em;line-height:1.8;font-size:15px}
.summ ol b{color:var(--wood)}
.summ blockquote{margin:10px 0;padding:8px 14px;background:rgba(160,122,60,.1);border-left:4px solid var(--gold);font:17px/1.7 var(--f-title);color:var(--ink2)}
.summ .think{font-size:15px;line-height:1.7;margin:8px 0 12px}
.summ .think b{display:inline-block;font:700 13px var(--f-title);color:#fff;background:var(--jade);padding:0 8px;margin-right:8px;border-radius:2px}
/* 後台段落分析 */
.pa{padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.pa:hover{background:rgba(160,122,60,.08)}
.pa-h{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.pa-n{flex:none;font:700 15px var(--f-title);color:var(--wood)}
.pa-s{flex:1;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa-h b{flex:none;font:700 15px var(--f-title);color:var(--jade)}
.pa-h b.hot{color:var(--red)}
.pa .track{height:12px;background:#eadcbc;border-radius:2px;overflow:hidden}
.pa .fill{height:100%;background:var(--jade)}.pa .fill.low{background:var(--red)}
.about{max-width:820px;margin:0 auto;line-height:1.9;font-size:16px}
.about h2{font:700 28px var(--f-title);letter-spacing:6px;margin:0 0 10px;text-align:center}
.about h4{font:700 18px var(--f-title);color:var(--red);letter-spacing:4px;margin:22px 0 6px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.about ul{margin:4px 0;padding-left:1.4em}
.about a{color:var(--red)}
.grid td.tm{font-size:13px;color:var(--ink2)}
.text p.flash{background:rgba(214,170,80,.35)}
.text p .pn{font-size:12px;color:var(--mute);font-family:var(--f-title);margin-right:6px;user-select:none}
.text.vert{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden;line-height:2.1;padding:34px 30px}
.text.vert p{margin:0 0 0 1.1em}
.text.vert .poemgrp{margin:0 0 0 1.5em;padding:0 12px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.text .endnote{text-align:center;color:var(--mute);font-family:var(--f-title);letter-spacing:6px;text-indent:0}

/* 插圖：裱框 */
.painting{margin:1.4em auto 1.8em;max-width:760px;text-indent:0;writing-mode:horizontal-tb}
.text.vert .painting{width:min(560px,70vh);margin:0 1.4em}
.mount{background:#e9dcc0;padding:14px;border:1px solid #b9a37a;box-shadow:0 0 0 6px #6b4529,0 0 0 8px #3e2616,0 12px 26px rgba(0,0,0,.28);cursor:zoom-in}
.mount img,.mount svg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#ddd0b2}
.painting figcaption{text-align:center;margin-top:16px;font:16px/1.6 var(--f-title);color:var(--ink2)}
.painting figcaption b{color:var(--red);letter-spacing:4px;margin-right:8px}


/* 漫畫分格：對話氣泡 */
.comic .mount{padding:10px;box-shadow:0 0 0 4px #2b1a10,0 10px 22px rgba(0,0,0,.3);border:2px solid #2b1a10;background:#f1e6c8}
.panel{position:relative;container-type:inline-size;overflow:hidden;line-height:1;text-indent:0}
.mount .panel>.tails{background:none;aspect-ratio:auto;position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.bub{position:absolute;z-index:2;box-sizing:border-box;padding:.55em .8em .6em;background:#fffaf0;color:#2a1d12;border:2px solid #2a1d12;border-radius:1.1em;
  font:600 clamp(10px,2.35cqw,17px)/1.5 var(--f-title);letter-spacing:.04em;text-align:left;writing-mode:horizontal-tb;box-shadow:2px 3px 0 rgba(42,29,18,.35)}
.bub .who{display:inline-block;background:#a83a2e;color:#fff6e6;font-size:.72em;letter-spacing:.12em;padding:0 .55em;border-radius:.3em;margin:0 0 .25em;line-height:1.5}
.bub.k-想{border-style:dashed;border-radius:2em;background:#f6f1ff}
.bub.k-吼{border-width:3.5px;font-size:clamp(12px,2.9cqw,21px);transform:rotate(-1.5deg);background:#fff3d6}
.bub.k-白{background:#f3e0a6;border-radius:.2em;box-shadow:3px 3px 0 #2a1d12;font-weight:500}
.bub.k-白 .who{display:none}
@container (max-width:460px){.bub{font-size:8.6px;padding:.35em .5em .4em;border-width:1.5px;letter-spacing:0}.bub.k-吼{font-size:10px;border-width:2px}.bub .who{font-size:.8em}}
.panel .no{position:absolute;left:6px;bottom:4px;z-index:3;font:700 clamp(12px,2.6cqw,20px) var(--f-title);color:#fff6e6;background:#2a1d12;padding:0 .5em;border-radius:.25em;opacity:.9}


/* 公告、班級挑戰 */
.ann{padding:16px 22px;margin:0 0 16px;border-left:6px solid var(--gold)}
.ann.pin{border-left-color:var(--red)}
.ann .ah{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.ann .ah b{font:700 19px var(--f-title);letter-spacing:2px;color:var(--wood)}
.ann .ah b small{background:var(--red);color:#fbeee0;font-size:12px;padding:1px 7px;border-radius:2px;margin-right:8px;vertical-align:2px}
.ann .ah span{font-size:14px;color:var(--mute)}
.ann p{margin:8px 0 4px;line-height:1.8}
.ann .anch{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font:15px var(--f-title);color:var(--ink2)}
.card .must{position:absolute;left:-6px;top:12px;background:var(--red);color:#fbeee0;font:13px var(--f-title);letter-spacing:2px;padding:2px 8px;box-shadow:2px 2px 0 rgba(0,0,0,.2)}
.board{margin:0 0 26px;padding:18px 22px}
.rank{margin-top:10px;display:grid;gap:4px}
.rk{display:grid;grid-template-columns:40px 1fr auto auto auto;gap:14px;align-items:center;padding:6px 10px;border-radius:3px;font-size:15px}
.rk:nth-child(odd){background:rgba(160,122,60,.08)}
.rk .no{font:700 18px var(--f-title);color:var(--gold);text-align:center}
.rk:nth-child(1) .no{color:var(--red)}
.rk .nm{font-family:var(--f-title);font-size:17px}
.rk.me{outline:2px solid var(--red);background:#fbeee0}
.rk .pf{color:var(--jade)}
.rk.gap{background:none;justify-content:center;display:block;text-align:center;color:var(--mute);padding:0}
.goal{font:15px var(--f-title);color:var(--jade);margin:0}
/* 人物・地圖 */
.atlas{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.graphbox,.mapbox{padding:10px}
.graphbox svg,.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.pcard,.timeline{padding:18px 20px;max-height:76vh;overflow:auto}
.pcard h3{margin:0 0 4px;font:700 24px var(--f-title);letter-spacing:4px}
.pcard .camp{display:inline-block;color:#fff;font:13px var(--f-title);padding:1px 9px;border-radius:2px;margin-bottom:8px}
.pcard ul{padding-left:1.2em;margin:6px 0;line-height:1.75}
.pcard h4{margin:14px 0 4px;font:700 16px var(--f-title);color:var(--wood);letter-spacing:2px}
.pcard .rl{cursor:pointer;color:var(--ink)}.pcard .rl:hover{color:var(--red)}
.gnode{cursor:pointer}.gnode text{pointer-events:none}
.gdim{opacity:.13}
.glab{font:12px var(--f-title);fill:var(--ink2);paint-order:stroke;stroke:#f6efdf;stroke-width:4px;stroke-linejoin:round}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:13px var(--f-title);color:var(--ink2);margin:4px 6px 8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tl-ch{margin:0 0 14px}
.tl-ch h4{margin:0 0 6px;font:700 17px var(--f-title);letter-spacing:2px;cursor:pointer;color:var(--wood)}
.tl-ch h4.on{color:var(--red)}
.tl-ev{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:6px 6px;border-radius:3px;cursor:pointer;font-size:15px;line-height:1.6}
.tl-ev:hover,.tl-ev.on{background:rgba(168,50,42,.09)}
.tl-ev b{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--wood);color:#f3e6c8;font:13px/22px var(--f-title);text-align:center}
.tl-ev small{color:var(--mute);display:block}
@keyframes pulse{0%{r:10;opacity:.9}100%{r:30;opacity:0}}
.mpulse{animation:pulse 1.4s ease-out infinite}
/* 錯題重練 */
.drill{max-width:760px;margin:0 auto;padding:26px 30px}
.drill .dp{display:flex;justify-content:space-between;color:var(--mute);font:15px var(--f-title);margin-bottom:10px}
.dbar{height:6px;background:#e6d6b2;border-radius:3px;overflow:hidden;margin-bottom:18px}.dbar div{height:100%;background:var(--jade)}
/* 教師分頁 */
.ttabs{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.ttabs .chip{font-size:16px;padding:7px 16px}
.tform{padding:20px 24px;display:grid;gap:12px}
.tform label{display:grid;gap:4px;font:15px var(--f-title);color:var(--ink2)}
.tform input[type=text],.tform input[type=date],.tform input[type=number],.tform textarea,.tform select{font:16px var(--f-body);padding:8px 10px;border:1px solid var(--line);background:#fffaf0;border-radius:3px;width:100%}
.tform textarea{min-height:70px;resize:vertical}
.tform .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tform .chs{display:flex;gap:8px;flex-wrap:wrap}
.tform .chs label,.tform .ansr label{display:inline-flex;gap:4px;align-items:center;background:#f8f0dc;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.tform .ansr{display:flex;gap:8px}
.tform .opt4{display:grid;grid-template-columns:64px 1fr;gap:8px 10px;align-items:center}
.tlist{display:grid;gap:12px;margin-bottom:22px}
.titem{padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.titem b{font:700 17px var(--f-title)}
.titem .meta{color:var(--mute);font-size:14px;margin-top:4px}
.titem .acts{display:flex;gap:6px}
.titem .acts button{font-size:14px;padding:4px 10px}
.done-rate{font-size:14px;color:var(--jade);margin-top:4px}
@media (max-width:900px){.atlas{grid-template-columns:1fr}.pcard,.timeline{max-height:none}.rk{grid-template-columns:32px 1fr auto auto;gap:8px}.rk .pf{display:none}}

/* 試題 */
.quiz{overflow:auto;padding:26px 24px}
.quiz h3{margin:0 0 4px;font:700 22px var(--f-title);letter-spacing:4px}
.quiz .sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.q{border-top:1px dashed var(--line);padding:16px 0 12px}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qn{font:700 16px var(--f-title);color:var(--wood)}
.tag{font:13px var(--f-title);padding:1px 9px;border-radius:2px;color:#fff}
.tag.t1{background:#8a5a33}.tag.t2{background:#3e6a5a}.tag.t3{background:#5a5a8a}.tag.t4{background:#a8322a}
.stem{margin:0 0 10px;line-height:1.75;font-size:16.5px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:5px 0;border:1px solid transparent;border-radius:3px;cursor:pointer;line-height:1.6;font-size:15.5px}
.opt:hover{background:rgba(160,122,60,.1)}
.opt input{display:none}
.opt .L{flex:none;width:26px;height:26px;border:1.5px solid var(--ink2);border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-title);margin-top:1px}
.opt.sel{background:rgba(168,50,42,.07);border-color:rgba(168,50,42,.35)}
.opt.sel .L{background:var(--red);border-color:var(--red);color:#fff}
.opt.right{background:rgba(62,106,90,.12);border-color:var(--jade)}
.opt.right .L{background:var(--jade);border-color:var(--jade);color:#fff}
.opt.wrong{background:rgba(168,50,42,.1);border-color:var(--red);text-decoration:line-through;text-decoration-color:rgba(168,50,42,.5)}
.locked .opt{cursor:default}
.fb{display:none;margin-top:8px;padding:10px 12px;background:#f3e9d2;border-left:4px solid var(--gold);font-size:15px;line-height:1.75}
.fb.show{display:block}
.fb .verdict{font:700 16px var(--f-title)}
.fb .verdict.ok{color:var(--jade)}.fb .verdict.no{color:var(--red)}
.link{background:none;border:none;color:var(--red);text-decoration:underline;font:14px var(--f-body);padding:0;margin-left:6px}
.qbar{position:sticky;bottom:-26px;background:linear-gradient(transparent,#f8f1df 30%);padding:18px 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---- 展示模式：電腦自動示範（免登入、不記錄） ---- */
.demo-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;max-width:min(760px,92vw);background:rgba(20,14,8,.92);color:#fbeee0;border:2px solid var(--gold);border-radius:6px;padding:10px 18px;font:17px/1.6 var(--f-title);letter-spacing:1px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:opacity .4s}
.demo-bar b{color:#ffd24a;margin-right:8px}
.demo-bar.hide{opacity:0}
.demo-x{position:fixed;right:14px;bottom:18px;z-index:61;background:rgba(20,14,8,.85);color:#fbeee0;border:1px solid var(--gold);border-radius:20px;padding:5px 14px;font:14px var(--f-title);cursor:pointer}
.demo-tag{position:fixed;left:14px;bottom:18px;z-index:61;background:var(--red);color:#fbeee0;border-radius:3px;padding:3px 12px;font:700 14px var(--f-title);letter-spacing:2px}
.dcur{position:fixed;z-index:70;width:22px;height:22px;margin:-4px 0 0 -4px;pointer-events:none;transition:left .9s ease,top .9s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.dcur svg{width:22px;height:22px}
.dcur.click:after{content:'';position:absolute;left:-6px;top:-6px;width:34px;height:34px;border:3px solid #ffd24a;border-radius:50%;animation:dclk .45s ease-out forwards}
@keyframes dclk{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.2)}}
.demo-end{position:fixed;inset:0;z-index:80;background:rgba(10,8,5,.82);display:grid;place-items:center}
.demo-end>div{background:#f8f1df;border:3px double var(--wood);padding:28px 36px;text-align:center;max-width:min(480px,90vw)}
.demo-end h3{font-size:26px;letter-spacing:8px;margin:0 0 10px;color:var(--red)}
.demo-end p{line-height:1.8;margin:6px 0 18px}
.demo-end .bt-act{justify-content:center}
.demo-start{margin-top:8px}

/* ---- 作答 ---- */
.bt{display:flex;flex-direction:column;gap:10px}
.bt h3{margin:0}
.bt-intro p{margin:6px 0;line-height:1.8}
.bt-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bt-hd b{font:700 17px var(--f-title);letter-spacing:2px}
.bt-hd span{font:14px var(--f-title);color:var(--ink2)}
/* 戰況面板：16-bit 風格（SNES 式藍底視窗、場景背景、像素人物、分段血條） */
.bf{--sz:96px;background:#101850;color:#fff;border:3px solid #f4f4ff;outline:2px solid #14143c;border-radius:5px;font-family:"Cubic 11",var(--f-title);position:relative;overflow:hidden;text-shadow:1px 1px 0 #000}
.bf-top{display:flex;align-items:center;gap:8px;padding:4px 10px;background:linear-gradient(#2e40d0,#16207a);border-bottom:2px solid #f4f4ff;font-size:13px}
.bf-tag{background:#f4d24a;color:#3a2a00;font-weight:700;padding:0 8px;letter-spacing:2px;border:2px solid #3a2a00;text-shadow:none;line-height:1.35}
.bf-title{font-size:16px;letter-spacing:2px;flex:1}
.bf-top small{color:#b8c8ff}
.bf-step{display:flex;align-items:center;gap:6px}
.bf-step em{font-style:normal;font-size:13px;min-width:52px;text-align:center;color:#ffe9a0}
.bf-step button{background:#f4d24a;color:#3a2a00;border:2px solid #3a2a00;font-weight:700;padding:0 10px;line-height:1.4;text-shadow:none;cursor:pointer}
.bf-step button:active{transform:translateY(1px)}
.bf-field{position:relative;padding:6px 8px 16px;min-height:170px;display:grid;align-content:center;background:#000;overflow:hidden}
.bf-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;image-rendering:pixelated;z-index:0}
.bf-war{position:relative;z-index:1;display:grid;gap:0}
.bf-hd{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:4px;min-height:20px}
.bf-hd span{background:rgba(12,16,70,.82);border:1px solid #9fb0ff;padding:0 8px;letter-spacing:1px;line-height:1.55}
.bf-hd span:empty{visibility:hidden}
.bf-row{display:grid;grid-template-columns:minmax(78px,25%) 1fr minmax(78px,25%);align-items:center;min-height:calc(var(--sz) * .86)}
.inf{background:linear-gradient(#2a3bb4,#141e70);border:2px solid #f4f4ff;border-radius:3px;padding:2px 6px 3px;min-width:0;box-shadow:2px 2px 0 #000}
.inf .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font:700 14px/1.25 var(--f-title);letter-spacing:1px;white-space:nowrap}
.inf .nm b{overflow:hidden;text-overflow:ellipsis;font-weight:700}
.inf.b .nm{flex-direction:row-reverse}
.inf .ub{height:9px;background:#000;border:1px solid #f4f4ff;padding:1px;margin:2px 0 0;box-sizing:border-box}
.inf .ub i{display:block;height:100%;transition:width 1s steps(16);background:repeating-linear-gradient(90deg,var(--c) 0 3px,rgba(0,0,0,.55) 3px 4px)}
.inf small{font-size:11px;letter-spacing:0;flex:none}
.inf.b{text-align:right}
.inf.win{--c:#4cd964}.inf.win small{color:#8bf5a2}
.inf.even{--c:#ffd24a}.inf.even small{color:#ffe07a}
.inf.lose{--c:#ff5a4a}.inf.lose small{color:#ff9a8c}
.stage{display:flex;justify-content:center;align-items:flex-end;gap:calc(var(--sz) * .3)}
.sp{width:var(--sz);height:var(--sz);position:relative;flex:none}
.sp:after{content:'';position:absolute;left:14%;right:14%;bottom:1%;height:calc(var(--sz) * .09);border-radius:50%;background:rgba(0,0,0,.38);z-index:-1}
.sp canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.sp.b canvas{transform:scaleX(-1)}
.sp.none{visibility:hidden}
.sp.lose{filter:grayscale(.7) brightness(.82)}
.sp.lose canvas{margin-top:6%}
.bf-war[data-n="1"]{--sz:128px}.bf-war[data-n="2"]{--sz:96px}.bf-war[data-n="3"],.bf-war[data-n="4"]{--sz:64px}
.bf.duel .bf-war{--sz:128px}
.bf-calm{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px 18px;padding:8px 0 4px}
.bf-calm .pc{display:grid;justify-items:center;gap:2px;font-size:13px;letter-spacing:1px}
.bf-calm .pc span{background:rgba(12,16,70,.82);border:1px solid #9fb0ff;padding:0 8px}
.bf-none{text-align:center;padding:20px 0 8px;font-size:15px;letter-spacing:4px}
.bf-none,.bf-calm{text-shadow:1px 1px 0 #000}
.bf-note{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-top:2px solid #f4f4ff;font-size:13.5px;line-height:1.6;background:linear-gradient(#2a3bb4,#141e70)}
.bf-note span{flex:1}
.bf-note button{background:none;border:none;color:#ffe07a;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;white-space:nowrap;text-shadow:inherit}
.bf-q{padding:0 10px 6px;font-size:12.5px;color:#cdd8ff;background:#141e70;line-height:1.55}
.sp.bf-lunge-a{animation:bfLungeA .5s}.sp.bf-lunge-b{animation:bfLungeB .5s}.sp.bf-shake{animation:btShake .42s}
@keyframes btShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes bfLungeA{0%{transform:translateX(0)}40%{transform:translateX(18px)}100%{transform:translateX(0)}}
@keyframes bfLungeB{0%{transform:translateX(0)}40%{transform:translateX(-18px)}100%{transform:translateX(0)}}
/* 版面：原文／戰況／檢測自由選搭（桌面） */
.vgrp{display:inline-flex;align-items:center;gap:6px;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}
.vgrp b{font:700 14px var(--f-title);color:var(--ink2);letter-spacing:1px}
.cols{grid-template-areas:"bf quiz" "txt quiz";grid-template-rows:auto minmax(0,1fr);gap:12px 26px}
.cols>#bf{grid-area:bf}.cols>#txt{grid-area:txt}.cols>#quiz{grid-area:quiz}
.cols.no-bf>#bf,.cols.no-txt>#txt,.cols.no-quiz>#quiz{display:none!important}
.cols.no-bf{grid-template-areas:"txt quiz";grid-template-rows:minmax(0,1fr)}
.cols.no-quiz{grid-template-columns:minmax(0,1fr);grid-template-areas:"bf" "txt";width:100%;max-width:1040px;margin:0 auto}
.cols.no-quiz.no-bf{grid-template-areas:"txt";grid-template-rows:minmax(0,1fr)}
.cols.no-txt{grid-template-areas:"bf quiz";grid-template-rows:minmax(0,1fr)}
.cols.no-txt>#bf{align-self:start}
.cols.no-txt.no-quiz{grid-template-columns:minmax(0,1fr);grid-template-areas:"bf";grid-template-rows:auto;max-width:1040px}
.cols.no-txt.no-bf{grid-template-columns:minmax(0,1fr);grid-template-areas:"quiz";max-width:820px;margin:0 auto;width:100%}
.cols.no-txt>#bf .bf-field{min-height:260px}
.cols.no-txt>#bf .bf-war[data-n="1"]{--sz:160px}.cols.no-txt>#bf .bf-war[data-n="2"]{--sz:128px}.cols.no-txt>#bf .bf-war[data-n="3"],.cols.no-txt>#bf .bf-war[data-n="4"]{--sz:96px}
.cols.no-txt>#bf.duel .bf-war{--sz:160px}
.bt-dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.bt-dots span{width:22px;height:22px;border:1.5px solid var(--ink2);border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-title);color:var(--ink2)}
.bt-dots span.ok{background:var(--jade);border-color:var(--jade);color:#fff}
.bt-dots span.no{background:var(--red);border-color:var(--red);color:#fff}
.bt-dots span.now{box-shadow:0 0 0 3px rgba(160,122,60,.45)}
.bt .q{margin:0}
.bt .opt{cursor:pointer;background:#fbf5e4;border:1px solid var(--line)}
.bt .opt.dim{opacity:.5;cursor:default}
.bt .opt.busy{opacity:.75}
.bt.shown .opt{cursor:default}
.bt-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.gen{display:flex;gap:10px;align-items:center;margin:8px 0 0;padding:8px 10px;background:#fbf5e4;border:1.5px solid var(--gold);animation:genIn .5s}
.gen .nm{flex:none;width:44px;height:44px;border-radius:50%;background:var(--wood);color:#f3dfb2;display:grid;place-items:center;font:700 15px var(--f-title);letter-spacing:0}
.gen b{font:700 15px var(--f-title)}.gen small{display:block;font-size:13.5px;line-height:1.6;color:var(--ink2)}
@keyframes genIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bt-end{padding:12px;border:1px solid var(--line);background:#f3e9d2;margin-bottom:8px}
.bt-end h3{font-size:24px;letter-spacing:6px;margin:0 0 4px;color:var(--red)}
@media (prefers-reduced-motion:reduce){.bf-shake,.bf-lunge{animation-duration:.01s}.bu .ub i{transition:none}}
.savest{font-size:14px;color:var(--mute);margin-right:auto}
.result{display:flex;align-items:center;gap:18px;padding:14px;margin:6px 0 4px;background:#f3e9d2;border:1px solid var(--line)}
.bigseal{width:86px;height:86px;flex:none;border:3px double var(--red);color:var(--red);border-radius:6px;display:grid;place-items:center;
  font:700 30px/1 var(--f-title);transform:rotate(-6deg);background:#fff6ec}
.bigseal small{display:block;font-size:13px;margin-top:4px;letter-spacing:2px}
.mtabs{display:none}

/* ---------- 教師後台 ---------- */
.tctrl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.tctrl select{padding:8px 10px;font-size:16px;border:1px solid var(--line);background:#fffaf0;border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#f8f1df;border:1px solid var(--line);padding:14px 16px;border-radius:3px}
.kpi span{font:14px var(--f-title);color:var(--mute)}
.kpi b{display:block;font:700 30px var(--f-title);color:var(--wood)}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--line);background:#fffaf0}
table.grid{border-collapse:collapse;width:100%;font-size:15px}
.grid th,.grid td{border:1px solid #e1d3b3;padding:7px 9px;text-align:center;white-space:nowrap}
.grid th{position:sticky;top:0;background:#efe2c3;font-family:var(--f-title);z-index:1}
.grid td.l{text-align:left}
.grid tr:hover td{background:#f6ecd6}
.grid tr.clk{cursor:pointer}
.sc{display:inline-block;min-width:38px;padding:1px 6px;border-radius:2px;font-weight:600}
.sc5{background:#3e6a5a;color:#fff}.sc4{background:#7fa08e;color:#fff}.sc3{background:#d9c38c}.sc2{background:#e7b39a}.sc1,.sc0{background:#c9594d;color:#fff}
.scd{color:var(--gold)}
.bars .b{display:grid;grid-template-columns:70px 1fr 64px;align-items:center;gap:10px;margin:8px 0;font-size:15px}
.bars .track{height:18px;background:#eadcbc;border-radius:2px;overflow:hidden}
