/* ================= 回末小結卡 ================= */
function summaryHTML(sm) {
  if (!sm) return '';
  return '<div class="summ"><div class="summ-h">本回大事</div><ol>' + sm.events.map(function (e) {
    var k = e.indexOf('：'); return '<li>' + (k > 0 ? '<b>' + esc(e.slice(0, k)) + '</b>' + esc(e.slice(k)) : esc(e)) + '</li>'; }).join('') + '</ol>' +
    (sm.quote ? '<blockquote>「' + esc(sm.quote.replace(/[。]$/, '')) + '」</blockquote>' : '') +
    (sm.think ? '<p class="think"><b>想一想</b>' + esc(sm.think) + '</p>' : '') +
    '<button class="btn jade wide" id="dlCard">下載小結卡（圖片）</button></div>';
}
function wrapLines(ctx, text, maxW) {
  var lines = [], cur = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text[i], test = cur + ch;
    if (ctx.measureText(test).width > maxW && cur) {
      if ('，。、；：！？」』）'.indexOf(ch) >= 0) { cur += ch; continue; }
      lines.push(cur); cur = ch;
    } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function downloadCard() {
  var d = S.chap, sm = d.result && d.result.summary; if (!sm) return;
  var W = 1080, H = 1440, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var c = cv.getContext('2d');
  var title = "'LXGW WenKai TC','標楷體',serif", body = "'Noto Serif TC','PMingLiU',serif";
  Promise.all([document.fonts.load('48px "LXGW WenKai TC"'), document.fonts.load('32px "Noto Serif TC"')]).catch(function () { }).then(function () {
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#f8f0dc'); g.addColorStop(1, '#ead9b4');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = '#4e3220'; c.fillRect(0, 0, W, 34); c.fillRect(0, H - 34, W, 34);
    c.strokeStyle = '#b08a4a'; c.lineWidth = 3; c.strokeRect(44, 70, W - 88, H - 140);
    c.fillStyle = '#a8322a'; c.fillRect(90, 120, 190, 64);
    c.fillStyle = '#fbeee0'; c.font = '700 34px ' + title; c.textAlign = 'center'; c.fillText(d.num, 185, 164);
    c.textAlign = 'left'; c.fillStyle = '#2a2420'; c.font = '700 50px ' + title;
    var t = d.title.split(/\s+/); c.fillText(t[0] || '', 90, 260); c.fillText(t[1] || '', 150, 330);
    c.fillStyle = '#a8322a'; c.font = '700 36px ' + title; c.fillText('本回大事', 90, 420);
    var y = 480; c.font = '32px ' + body;
    sm.events.forEach(function (e, i) {
      c.fillStyle = '#a8322a'; c.fillText((i + 1) + '.', 90, y);
      c.fillStyle = '#2a2420';
      wrapLines(c, e, W - 230).forEach(function (ln, k) { c.fillText(ln, 140, y + k * 48); y += 0; });
      y += wrapLines(c, e, W - 230).length * 48 + 18;
    });
    if (sm.quote) {
      y += 20; c.fillStyle = 'rgba(160,122,60,.12)'; var ql = wrapLines(c, '「' + sm.quote.replace(/[。]$/, '') + '」', W - 260);
      c.font = '36px ' + title; ql = wrapLines(c, '「' + sm.quote.replace(/[。]$/, '') + '」', W - 260);
      c.fillRect(90, y - 10, W - 180, ql.length * 54 + 40);
      c.fillStyle = '#a07a3c'; c.fillRect(90, y - 10, 8, ql.length * 54 + 40);
      c.fillStyle = '#5b4f45'; ql.forEach(function (ln, k) { c.fillText(ln, 130, y + 44 + k * 54); });
      y += ql.length * 54 + 70;
    }
    if (sm.think) {
      c.fillStyle = '#3e6a5a'; c.font = '700 32px ' + title; c.fillText('想一想', 90, y + 20);
      c.fillStyle = '#2a2420'; c.font = '30px ' + body;
      wrapLines(c, sm.think, W - 220).forEach(function (ln, k) { c.fillText(ln, 90, y + 70 + k * 44); });
    }
    var res = d.result;
    c.save(); c.translate(W - 200, H - 250); c.rotate(-0.12);
    c.strokeStyle = '#a8322a'; c.lineWidth = 6; c.strokeRect(-80, -80, 160, 160); c.lineWidth = 2; c.strokeRect(-68, -68, 136, 136);
    c.fillStyle = '#a8322a'; c.textAlign = 'center'; c.font = '700 54px ' + title; c.fillText(res.score + '/' + res.total, 0, 10);
    c.font = '700 26px ' + title; c.fillText(res.score === res.total ? '全　對' : '已　閱', 0, 52); c.restore();
    c.textAlign = 'left'; c.fillStyle = '#8b7c6b'; c.font = '26px ' + title;
    c.fillText((S.user ? (S.user.cls + ' ' + S.user.name) : '試閱讀者') + '・' + new Date().toLocaleDateString('zh-TW'), 90, H - 110);
    c.fillText($('#siteTitle').textContent, 90, H - 150);
    cv.toBlob(function (b) {
      var url = URL.createObjectURL(b), a = document.createElement('a');
      a.href = url; a.download = d.num + '小結卡.png'; a.target = '_self'; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      toast('已下載小結卡');
    }, 'image/png');
  });
}

/* ================= 後台：最需要講解的段落 ================= */
function paraAnalysis(studs, ch, idx) {
  var chap = S.tdata.chapters.filter(function (c) { return c.ch === ch; })[0]; if (!chap) return '';
  var st = qStats(studs, ch, idx), groups = {};
  chap.qs.forEach(function (q) {
    var x = st[q.no]; if (!x || !x.n) return;
    var g = groups[q.para] = groups[q.para] || { para: q.para, text: q.paraText, qs: [], max: 0 };
    var rate = 1 - x.ok / x.n; g.qs.push({ no: q.no, type: q.type, rate: rate, n: x.n }); g.max = Math.max(g.max, rate);
  });
  var list = Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) { return b.max - a.max; });
  S.paraList = list;
  if (!list.length) return '<p class="note">還沒有學生交卷。</p>';
  return list.map(function (g, i) {
    var pct = Math.round(g.max * 100);
    return '<div class="pa" data-k="' + i + '"><div class="pa-h"><span class="pa-n">第 ' + g.para + ' 段</span><span class="pa-s">' + esc(g.text.slice(0, 46)) + '…</span>' +
      '<b class="' + (pct >= 40 ? 'hot' : '') + '">答錯 ' + pct + '%</b></div><div class="track"><div class="fill' + (pct >= 40 ? ' low' : '') + '" style="width:' + pct + '%"></div></div>' +
      '<div class="note">' + g.qs.map(function (q) { return '第' + cnum(q.no) + '題（' + q.type + '）答錯 ' + Math.round(q.rate * 100) + '%'; }).join('；') + '</div></div>';
  }).join('');
}

function fmtDur(s) { s = Math.round(s || 0); if (!s) return '—'; var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + '時' : '') + (h || m ? m + '分' : '') + (h ? '' : x + '秒'); }
function mins(s) { return s ? Math.round(s / 6) / 10 : ''; }
function shortTime(t) { return String(t || '').slice(5, 16); }
['pointerdown', 'keydown', 'wheel', 'touchstart', 'mousemove'].forEach(function (ev) { document.addEventListener(ev, function () { S.lastAct = Date.now(); }, { passive: true, capture: true }); });
document.addEventListener('scroll', function () { S.lastAct = Date.now(); }, { passive: true, capture: true });
setInterval(function () {
  if (!S.chap || !$('#txt') || document.hidden || S.guest) return;
  if (Date.now() - (S.lastAct || 0) > 120000) return;   // 閒置超過 2 分鐘不計時
  S.spent = (S.spent || 0) + 1;
  if (S.spent - (S.spentSaved || 0) >= 60 && S.token && !S.draftTimer && !S.saving) saveDraft(false);
}, 1000);

function visiblePara() {
  var tx = $('#txt'); if (!tx) return null;
  var c = tx.getBoundingClientRect(), top = Math.max(c.top, 80), bottom = Math.min(c.bottom, innerHeight), left = Math.max(c.left, 0), right = Math.min(c.right, innerWidth);
  var ps = $$('p[data-i]', tx);
  for (var k = 0; k < ps.length; k++) {
    var r = ps[k].getBoundingClientRect();
    if (r.bottom > top + 10 && r.top < bottom && r.right > left && r.left < right) return ps[k];
  }
  return ps[0] || null;
}
function nowStr() { var d = new Date(), z = function (n) { return ('0' + n).slice(-2); }; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); }

function readPos() {
  var tx = $('#txt'); if (!tx) return 0;
  if (tx.offsetParent === null) return S.lastPos || 0;   // 原文被隱藏時，沿用最後一次的閱讀位置
  var v = readPos0(tx); S.lastPos = v; return v;
}
function readPos0(tx) {
  if (window.innerWidth <= 900) return Math.max(0, Math.min(1, scrollY / Math.max(1, document.body.scrollHeight - innerHeight)));
  if (tx.classList.contains('vert')) return 0;
  return Math.max(0, Math.min(1, tx.scrollTop / Math.max(1, tx.scrollHeight - tx.clientHeight)));
}
