<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#f1e7d0; --paper2:#e8dabb; --ink:#2a2420; --ink2:#5b4f45; --mute:#8b7c6b;
  --red:#a8322a; --red2:#c2493c; --gold:#a07a3c; --jade:#3e6a5a; --wood:#4e3220; --line:#cdbb98;
  --f-title:'LXGW WenKai TC','Noto Serif TC','標楷體',serif;
  --f-body:'Noto Serif TC','PMingLiU','新細明體',serif;
  --fs:18px; --lh:2.05; --read-font:var(--f-body);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--f-body);color:var(--ink);background:var(--paper);
  background-image:
    radial-gradient(ellipse at 15% 10%,rgba(255,250,235,.8),transparent 55%),
    radial-gradient(ellipse at 85% 90%,rgba(170,130,70,.18),transparent 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-attachment:fixed;
}
button{font-family:var(--f-title);cursor:pointer}
input,select{font-family:var(--f-body)}
.hidden{display:none!important}

/* ---------- 頂欄 ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 22px;background:linear-gradient(#5a3a25,#3f2717);color:#f3e6c8;
  box-shadow:0 3px 0 #2c1a0f,0 6px 18px rgba(0,0,0,.25);border-bottom:2px solid #b08a4a}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer}
.seal{width:46px;height:46px;flex:none;background:var(--red);color:#fbeee0;border-radius:6px;
  display:grid;place-items:center;font:700 17px/1 var(--f-title);writing-mode:vertical-rl;letter-spacing:2px;
  box-shadow:inset 0 0 0 2px #fbeee0,inset 0 0 0 4px var(--red);transform:rotate(-3deg)}
.brand h1{margin:0;font:700 24px/1.2 var(--f-title);letter-spacing:4px}
.brand small{font:14px var(--f-title);opacity:.75;letter-spacing:2px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tbtn{white-space:nowrap;flex:none;background:transparent;border:1px solid #b08a4a;color:#f3e6c8;border-radius:999px;padding:5px 13px;font-size:15px}
.tbtn:hover{background:rgba(255,235,200,.12)}
.tbtn.on{background:#b08a4a;color:#2c1a0f}
.who{font:15px var(--f-title);opacity:.9;margin:0 4px}

main{max-width:1320px;margin:0 auto;padding:26px 20px 80px}

/* ---------- 卷軸面板 ---------- */
.scrollpanel{position:relative;background:#f8f1df;border:1px solid var(--line);border-radius:4px;
  box-shadow:0 1px 0 #fff inset,0 12px 30px rgba(80,50,20,.18);padding:30px 34px}
.scrollpanel:before,.scrollpanel:after{content:"";position:absolute;left:-10px;right:-10px;height:16px;
  background:linear-gradient(#6b4529,#3e2616);border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.scrollpanel:before{top:-10px}.scrollpanel:after{bottom:-10px}

/* ---------- 登入 ---------- */
.loginwrap{max-width:560px;margin:30px auto}
.poemline{text-align:center;font:20px/2 var(--f-title);color:var(--ink2);letter-spacing:6px;margin:0 0 6px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:18px 0 20px}
.tab{flex:1;background:none;border:none;padding:10px 4px;font-size:18px;color:var(--mute);border-bottom:3px solid transparent}
.tab.on{color:var(--red);border-color:var(--red)}
.field{margin:0 0 14px}
.field label{display:block;font:15px var(--f-title);color:var(--ink2);margin-bottom:5px}
.field input{width:100%;padding:11px 12px;font-size:17px;border:1px solid var(--line);border-radius:3px;background:#fffaf0}
.field input:focus{outline:2px solid rgba(168,50,42,.35);border-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:var(--red);color:#fbeee0;border:none;border-radius:3px;padding:11px 22px;font-size:18px;letter-spacing:3px;
  box-shadow:0 3px 0 #6e1d17}
.btn:hover{background:var(--red2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6e1d17}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red);box-shadow:none}
.btn.jade{background:var(--jade);box-shadow:0 3px 0 #23413a}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:wait}
.note{font-size:14px;color:var(--mute);line-height:1.7}
.err{color:var(--red);font-size:15px;min-height:1.4em;margin:6px 0}

/* ---------- 目錄 ---------- */
.homehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 26px;flex-wrap:wrap}
.homehead h2{margin:0;font:700 30px var(--f-title);letter-spacing:6px}
.homehead p{margin:4px 0 0;color:var(--ink2)}
.stat{display:flex;gap:18px}
.stat div{text-align:center;font-family:var(--f-title)}
.stat b{display:block;font-size:28px;color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.card{position:relative;height:370px;background:linear-gradient(90deg,#efe2c3,#f8f0dc 20%,#f8f0dc 80%,#ead9b4);
  border:1px solid var(--line);border-radius:3px;box-shadow:0 8px 18px rgba(80,50,20,.16);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;padding:16px 8px 12px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 26px rgba(80,50,20,.24)}
.card .no{font:700 16px var(--f-title);color:#fbeee0;background:var(--wood);padding:3px 12px;border-radius:2px;letter-spacing:3px}
.card .vt{flex:1;align-self:center;margin-top:16px;writing-mode:vertical-rl;direction:ltr;text-orientation:upright;
  font:21px/1.3 var(--f-title);letter-spacing:5px;white-space:nowrap}
.card .vt span{display:block;margin-left:14px}
.card .st{font-size:14px;color:var(--mute);font-family:var(--f-title);align-self:flex-end;margin-right:4px}
.card .st.c{align-self:center;margin-right:0}
.card .stamp{position:absolute;left:10px;bottom:10px;width:50px;height:50px;border:2px solid var(--red);color:var(--red);
  border-radius:50%;display:grid;place-items:center;font:700 15px/1.1 var(--f-title);text-align:center;transform:rotate(-14deg);
  background:rgba(255,245,235,.6)}
.card.locked{opacity:.55;filter:grayscale(.6);cursor:not-allowed}
.card.locked:hover{transform:none}
.guestbox{margin:14px 0 4px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.guestbox .note{text-align:center;margin:8px 0 0}
.card .stamp.draft{border-color:var(--gold);color:var(--gold);border-radius:4px}

/* ---------- 閱讀頁 ---------- */
.rhead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.chno{font:700 18px var(--f-title);color:#fbeee0;background:var(--red);padding:6px 14px;border-radius:2px;letter-spacing:4px}
.couplet{margin:0;font:700 26px/1.4 var(--f-title);letter-spacing:5px;display:flex;gap:28px;flex-wrap:wrap}
.rtools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#f8f0dc;border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:15px}
.chip.on{background:var(--wood);color:#f3e6c8;border-color:var(--wood)}
main:has(.reader){padding-bottom:14px}
.reader{display:flex;flex-direction:column;height:calc(100vh - 118px);min-height:460px}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);gap:26px}
.cols>.scrollpanel{height:100%;min-height:0;border-top:9px solid var(--wood);border-bottom:9px solid var(--wood);border-radius:3px}
.cols>.scrollpanel:before,.cols>.scrollpanel:after{display:none}
.text{overflow:auto;font-size:var(--fs);line-height:var(--lh);font-family:var(--read-font);text-align:justify;padding:34px 40px}
.text p{position:relative;margin:0 0 1.1em;text-indent:2em;transition:background 1.2s}
.text p.bm:before{content:"";position:absolute;left:-26px;top:.35em;width:12px;height:26px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.text.vert p.bm:before{left:auto;right:.2em;top:-22px;width:26px;height:12px;clip-path:polygon(0 0,100% 0,75% 50%,100% 100%,0 100%)}
.text .poemgrp p.poem, .text p.quote{font-family:var(--read-font)}
.rhead{position:relative}
.pop{position:absolute;right:0;top:100%;margin-top:8px;z-index:30;width:min(380px,92vw);background:#fbf5e6;border:1px solid var(--line);border-top:6px solid var(--wood);
  border-radius:3px;box-shadow:0 14px 30px rgba(60,35,15,.28);padding:16px 18px;font-size:15px}
.pop h5{margin:2px 0 8px;font:700 15px var(--f-title);color:var(--wood);letter-spacing:2px}
.pop .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pop .chip{font-size:14px}
.pop input[type=range]{width:100%;accent-color:var(--red)}
.pop .preview{border:1px dashed var(--line);padding:10px 12px;line-height:var(--lh);font-family:var(--read-font);font-size:var(--fs);background:#fffaf0}
.bmlist{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
.bmlist li{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
.bmlist li:hover{background:rgba(160,122,60,.1)}
.bmlist .n{flex:none;font:700 13px var(--f-title);color:#fff;background:var(--red);padding:1px 7px;border-radius:2px}
.bmlist .s{flex:1;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmlist .x{flex:none;background:none;border:none;color:var(--mute);font-size:18px;padding:0 4px}
.bmempty{color:var(--mute);font-size:14px;margin:4px 0 0}
.text .poemgrp{margin:0 0 1.5em;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.text p.poem{text-indent:0;text-align:center;font-family:var(--f-title);font-size:1.08em;line-height:2;color:var(--ink2);margin:0}
.text p.quote{text-indent:0;margin:0 2em 1.3em;padding:12px 18px;font-family:var(--f-title);color:var(--ink2);background:rgba(160,122,60,.08);border-left:3px solid var(--gold)}
.text .source{writing-mode:horizontal-tb;margin-top:1.4em;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;line-height:1.8;color:var(--mute);text-indent:0}
.text .source a{color:var(--red)}
.text.vert p.quote{margin:2em 0 0 1.3em;border-left:none;border-top:3px solid var(--gold)}
/* 註釋與人物 */
.text .nt{border-bottom:1.5px dotted var(--red);cursor:help}
.text .ps{color:#6b3a1e;cursor:pointer}
/* 專名號：人名、地名、朝代、年號加直線；書名加波浪線。相鄰專名之間留空隙 */
.text .zm,.preview .zm{background:linear-gradient(currentColor,currentColor) no-repeat 50% 100%/calc(100% - 4px) 1px}
.text.vert .zm{background-position:0 50%;background-size:1px calc(100% - 4px)}
.text .zm.bk{background:none;text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:.32em}
.text.vert .zm.bk{text-underline-position:left}
.text .zm.pk{cursor:help}
.pnoff .text .zm,.pnoff .preview .zm{background:none}
.pnoff .text .zm.bk{text-decoration:none}
.pnoff .text .ps{border-bottom:1px solid rgba(107,58,30,.25)}
/* 選字小工具 */
#selbar{position:fixed;z-index:60;display:none;gap:6px;background:var(--wood);padding:6px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#selbar.show{display:flex}
#selbar a,#selbar button{font:14px var(--f-title);color:#f3e6c8;background:transparent;border:1px solid rgba(243,230,200,.4);border-radius:4px;padding:5px 10px;text-decoration:none;white-space:nowrap;cursor:pointer}
#selbar a:hover,#selbar button:hover{background:rgba(243,230,200,.15)}
.text .zm.pk:hover,.text .nt:hover,.text .ps:hover{background:rgba(214,170,80,.25)}
#tip{position:fixed;z-index:70;display:none;background:#fbf5e6;border:1px solid var(--line);border-top:6px solid var(--red);border-radius:3px;
  box-shadow:0 14px 30px rgba(60,35,15,.3);padding:14px 16px 12px;font-size:15px;line-height:1.7;max-height:60vh;overflow:auto}
#tip.show{display:block}
#tip .tipx{position:absolute;right:6px;top:2px;background:none;border:none;font-size:20px;color:var(--mute)}
#tip .tiph{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;padding-right:18px}
#tip .tiph b{font:700 20px var(--f-title)}
#tip .zy{font-size:14px;color:var(--red);letter-spacing:1px}
#tip .camp{font:13px var(--f-title);background:var(--jade);color:#fff;padding:0 8px;border-radius:2px}
#tip .tipa{font-size:13px;color:var(--mute)}
#tip .tipd{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
#tip .tipd b{font:700 14px var(--f-title);color:var(--wood)}
#tip .tipd p{margin:4px 0;font-size:14px}
#tip .tipd p span{display:inline-block;font:12px var(--f-title);color:#fff;background:var(--wood);padding:0 6px;margin-right:6px;border-radius:2px}
/* 進度與成就 */
.progress{margin:0 0 26px;padding:18px 22px}
.pg-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--mute)}
.pg-top b{font:700 17px var(--f-title);color:var(--wood);letter-spacing:2px}
.pg-bar{height:8px;background:#e6d6b2;border-radius:4px;margin:8px 0 12px;overflow:hidden}
.pg-bar div{height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.pg-nodes{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.pg-nodes i{width:22px;height:2px;background:var(--line)}
.node{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-title);border:2px solid var(--line);color:var(--mute);background:#fffaf0}
.node.draft{border-color:var(--gold);color:var(--gold)}
.node.done{background:var(--red);border-color:var(--red);color:#fff}
.node.perfect{box-shadow:0 0 0 3px rgba(214,170,80,.6)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin-top:10px}
.ach{text-align:center;cursor:pointer;opacity:.35;filter:grayscale(1)}
.ach.got{opacity:1;filter:none}
.ach .seal2{display:inline-grid;place-items:center;width:52px;height:52px;border:2.5px solid var(--red);color:var(--red);border-radius:6px;font:700 18px/1.05 var(--f-title);
  writing-mode:vertical-rl;letter-spacing:2px;transform:rotate(-5deg);background:rgba(255,245,235,.7)}
.ach.got .seal2{background:var(--red);color:#fbeee0}
.ach small{display:block;margin-top:6px;font:13px var(--f-title);color:var(--ink2)}
/* 錯題本 */
.mlist{display:grid;gap:18px}
.mq{padding:20px 24px}
.mq.fixed{opacity:.75}
.chno.sm{font-size:13px;padding:2px 8px;letter-spacing:2px}
.okmark{margin-left:auto;font:700 13px var(--f-title);color:var(--jade);border:1.5px solid var(--jade);padding:0 8px;border-radius:2px}
.mbar{display:flex;align-items:center;gap:12px;margin-top:8px}
.mq .opt.wrong{text-decoration:none}
/* 回末小結 */
.summ{margin:12px 0 4px;padding:16px 18px;background:#fffaf0;border:1px solid var(--line);border-left:5px solid var(--red)}
.summ-h{font:700 18px var(--f-title);color:var(--red);letter-spacing:3px;margin-bottom:6px}
.summ ol{margin:0 0 10px;padding-left:1.4em;line-height:1.8;font-size:15px}
.summ ol b{color:var(--wood)}
.summ blockquote{margin:10px 0;padding:8px 14px;background:rgba(160,122,60,.1);border-left:4px solid var(--gold);font:17px/1.7 var(--f-title);color:var(--ink2)}
.summ .think{font-size:15px;line-height:1.7;margin:8px 0 12px}
.summ .think b{display:inline-block;font:700 13px var(--f-title);color:#fff;background:var(--jade);padding:0 8px;margin-right:8px;border-radius:2px}
/* 後台段落分析 */
.pa{padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.pa:hover{background:rgba(160,122,60,.08)}
.pa-h{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.pa-n{flex:none;font:700 15px var(--f-title);color:var(--wood)}
.pa-s{flex:1;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa-h b{flex:none;font:700 15px var(--f-title);color:var(--jade)}
.pa-h b.hot{color:var(--red)}
.pa .track{height:12px;background:#eadcbc;border-radius:2px;overflow:hidden}
.pa .fill{height:100%;background:var(--jade)}.pa .fill.low{background:var(--red)}
.about{max-width:820px;margin:0 auto;line-height:1.9;font-size:16px}
.about h2{font:700 28px var(--f-title);letter-spacing:6px;margin:0 0 10px;text-align:center}
.about h4{font:700 18px var(--f-title);color:var(--red);letter-spacing:4px;margin:22px 0 6px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.about ul{margin:4px 0;padding-left:1.4em}
.about a{color:var(--red)}
.grid td.tm{font-size:13px;color:var(--ink2)}
.text p.flash{background:rgba(214,170,80,.35)}
.text p .pn{font-size:12px;color:var(--mute);font-family:var(--f-title);margin-right:6px;user-select:none}
.text.vert{writing-mode:vertical-rl;overflow-x:auto;overflow-y:hidden;line-height:2.1;padding:34px 30px}
.text.vert p{margin:0 0 0 1.1em}
.text.vert .poemgrp{margin:0 0 0 1.5em;padding:0 12px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.text .endnote{text-align:center;color:var(--mute);font-family:var(--f-title);letter-spacing:6px;text-indent:0}

/* 插圖：裱框 */
.painting{margin:1.4em auto 1.8em;max-width:760px;text-indent:0;writing-mode:horizontal-tb}
.text.vert .painting{width:min(560px,70vh);margin:0 1.4em}
.mount{background:#e9dcc0;padding:14px;border:1px solid #b9a37a;box-shadow:0 0 0 6px #6b4529,0 0 0 8px #3e2616,0 12px 26px rgba(0,0,0,.28);cursor:zoom-in}
.mount img,.mount svg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#ddd0b2}
.painting figcaption{text-align:center;margin-top:16px;font:16px/1.6 var(--f-title);color:var(--ink2)}
.painting figcaption b{color:var(--red);letter-spacing:4px;margin-right:8px}


/* 漫畫分格：對話氣泡 */
.comic .mount{padding:10px;box-shadow:0 0 0 4px #2b1a10,0 10px 22px rgba(0,0,0,.3);border:2px solid #2b1a10;background:#f1e6c8}
.panel{position:relative;container-type:inline-size;overflow:hidden;line-height:1;text-indent:0}
.mount .panel>.tails{background:none;aspect-ratio:auto;position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.bub{position:absolute;z-index:2;box-sizing:border-box;padding:.55em .8em .6em;background:#fffaf0;color:#2a1d12;border:2px solid #2a1d12;border-radius:1.1em;
  font:600 clamp(10px,2.35cqw,17px)/1.5 var(--f-title);letter-spacing:.04em;text-align:left;writing-mode:horizontal-tb;box-shadow:2px 3px 0 rgba(42,29,18,.35)}
.bub .who{display:inline-block;background:#a83a2e;color:#fff6e6;font-size:.72em;letter-spacing:.12em;padding:0 .55em;border-radius:.3em;margin:0 0 .25em;line-height:1.5}
.bub.k-想{border-style:dashed;border-radius:2em;background:#f6f1ff}
.bub.k-吼{border-width:3.5px;font-size:clamp(12px,2.9cqw,21px);transform:rotate(-1.5deg);background:#fff3d6}
.bub.k-白{background:#f3e0a6;border-radius:.2em;box-shadow:3px 3px 0 #2a1d12;font-weight:500}
.bub.k-白 .who{display:none}
@container (max-width:460px){.bub{font-size:8.6px;padding:.35em .5em .4em;border-width:1.5px;letter-spacing:0}.bub.k-吼{font-size:10px;border-width:2px}.bub .who{font-size:.8em}}

<script>
/* ================= 古琴音樂（Web Audio 即時合成，無外部音檔） ================= */
var Qin = (function () {
  var ctx = null, master, sfxGain, musicGain, verb, playing = false, timer = null, nextT = 0, idx = 4;
  var sfxOn = true;
  // D 宮五聲音階：宮 商 角 徵 羽
  var base = 146.83, steps = [0, 2, 4, 7, 9];
  function f(i) { var o = Math.floor(i / 5), s = steps[((i % 5) + 5) % 5]; return base * Math.pow(2, o + s / 12); }
  function init() {
    if (ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
    verb = ctx.createConvolver();
    var len = ctx.sampleRate * 3.2, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var d = buf.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    verb.buffer = buf;
    var wet = ctx.createGain(); wet.gain.value = .32; verb.connect(wet); wet.connect(master);
    musicGain = ctx.createGain(); musicGain.gain.value = 0; musicGain.connect(master); musicGain.connect(verb);
    sfxGain = ctx.createGain(); sfxGain.gain.value = .55; sfxGain.connect(master); sfxGain.connect(verb);
  }
  function pluck(freq, t, dur, vel, dest) {
    var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), o3 = ctx.createOscillator();
    var g = ctx.createGain(), lp = ctx.createBiquadFilter();

    o1.frequency.setValueAtTime(freq * 1.006, t); o1.frequency.exponentialRampToValueAtTime(freq, t + .08);
    o2.frequency.value = freq * 2; o3.frequency.value = freq * 3.01;
    var g2 = ctx.createGain(); g2.gain.value = .22; var g3 = ctx.createGain(); g3.gain.value = .07;
    // 吟猱：輕微顫音
    var lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(freq * .006, t + Math.min(dur, 1.2)); lfo.connect(lg); lg.connect(o1.frequency);
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(520, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vel, t + .006);
    g.gain.exponentialRampToValueAtTime(vel * .35, t + .25); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o1.connect(lp); o2.connect(g2); g2.connect(lp); o3.connect(g3); g3.connect(lp); lp.connect(g); g.connect(dest);

  }

    var beat = .62, n = 5 + Math.floor(Math.random() * 5);
    pluck(f(0) / 2, t, 6, .09, musicGain);           // 低音散聲
    if (Math.random() < .6) pluck(f(3) / 2, t + .02, 5.5, .05, musicGain);
    for (var k = 0; k < n; k++) {
      idx += [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)];
      idx = Math.max(2, Math.min(12, idx));
      var dur = [1, 1, 1.5, .75, 2, .5][Math.floor(Math.random() * 6)] * beat;
      var last = k === n - 1;

  }

    if (!playing) return;

    var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();

      var o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = p[0];

  function gong() {

      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(p[1], t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + 3.5);
      o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 3.6);
    });
  }

    toggle: function () {
      init(); if (!ctx) return false; ctx.resume();
      playing = !playing;
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(playing ? .75 : 0, ctx.currentTime + 1.2);

    setSfx: function (v) { sfxOn = v; },

    }
  };

}

/* 氣泡尾巴：依氣泡實際大小，從最近的邊畫向指定位置（百分比座標） */
function layoutBubbles(root) {
  (root || document).querySelectorAll('.panel').forEach(function (p) {
    var W = p.clientWidth, H = p.clientHeight; if (!W || !H) return;
    var svg = p.querySelector('.tails'), out = '';
    p.querySelectorAll('.bub').forEach(function (b) {
      b.style.top = b.dataset.y0 || (b.dataset.y0 = b.style.top); b.style.left = b.dataset.x0 || (b.dataset.x0 = b.style.left);
      if (b.offsetTop + b.offsetHeight > H - 2) b.style.top = Math.max(2, H - 2 - b.offsetHeight) + 'px';
      if (b.offsetLeft + b.offsetWidth > W - 2) b.style.left = Math.max(2, W - 2 - b.offsetWidth) + 'px';
    });
    p.querySelectorAll('.bub').forEach(function (b) {
      var tx = +b.dataset.tx, ty = +b.dataset.ty;
      if (b.classList.contains('k-白') || (!tx && !ty)) return;
      var L = b.offsetLeft / W * 100, T = b.offsetTop / H * 100, w = b.offsetWidth / W * 100, h = b.offsetHeight / H * 100;
      var cx = L + w / 2, cy = T + h / 2, bx, by, ax, ay, bw = Math.min(4.2, w * 0.28);
      var below = ty > T + h, above = ty < T;
      if (below || above) { by = below ? T + h - 1.2 : T + 1.2; bx = Math.max(L + bw + 2, Math.min(L + w - bw - 2, (cx + tx) / 2)); ax = bx - bw; ay = by; var cxp = bx + bw, cyp = by; out += pathT(ax, ay, cxp, cyp, tx, ty, b); }
      else { bx = tx < L ? L + 1.2 : L + w - 1.2; by = Math.max(T + 3, Math.min(T + h - 3, ty)); out += pathT(bx, by - 2.2, bx, by + 2.2, tx, ty, b); }
    });
    svg.innerHTML = out;
  });
}
function pathT(x1, y1, x2, y2, tx, ty, b) {

    return [[.62, 1.5], [.34, 1.0], [.12, .6]].map(function (q) { return '<ellipse cx="' + (mx + (tx - mx) * q[0]) + '" cy="' + (my + (ty - my) * q[0]) + '" rx="' + q[1] + '" ry="' + (q[1] * 1.7) + '" fill="#f6f1ff" stroke="#2a1d12" stroke-width=".35"/>'; }).join('');
  }
  return '<polygon points="' + x1 + ',' + y1 + ' ' + x2 + ',' + y2 + ' ' + tx + ',' + ty + '" fill="#fffaf0" stroke="#2a1d12" stroke-width=".4" stroke-linejoin="round"/>';
}

  var chk = d.chapters.map(function (c) { return '<label><input type="checkbox" value="' + c.ch + '"' + ((e.chs || []).indexOf(c.ch) >= 0 ? ' checked' : '') + '>' + esc(c.num) + '</label>'; }).join('');
  view(tTabs() + '<div class="homehead"><div><h2>公告與必讀</h2><p>公告會出現在學生首頁；勾選必讀回次，學生的回目卡會標上「必讀」，你可在這裡看完成人數。</p></div></div>' +
    '<h4 class="sec">' + (e.id ? '編輯公告' : '新增公告') + '</h4><div class="scrollpanel tform" id="annForm">' +
    '<label>標題<input type="text" id="aTitle" maxlength="60" value="' + esc(e.title || '') + '" placeholder="例：本週必讀第三回"></label>' +
    '<label>內容（選填）<textarea id="aBody" maxlength="1000" placeholder="給學生的說明">' + esc(e.body || '') + '</textarea></label>' +
    '<div class="row"><label>對象班級<input type="text" id="aTo" list="clsList" value="' + esc(e.to || '全部') + '" placeholder="全部，或 301,302"><datalist id="clsList"><option>全部</option>' + classes.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</datalist></label>' +
    '<label>截止日期（選填）<input type="date" id="aDue" value="' + esc((e.due || '').replace(/\//g, '-')) + '"></label>' +
    '<label>置頂<span class="ansr"><label><input type="checkbox" id="aPin"' + (e.pin ? ' checked' : '') + '>置頂（過了截止日仍顯示）</label></span></label></div>' +
    '<label>必讀回次（選填）<div class="chs" id="aChs">' + chk + '</div></label>' +
    '<div class="mbtns" style="justify-content:flex-start">' + (e.id ? '<button class="btn ghost" id="aCancel">取消編輯</button>' : '') + '<button class="btn" id="aSave">' + (e.id ? '儲存修改' : '發布公告') + '</button></div></div>' +
    '<h4 class="sec">已發布（' + (d.anns || []).length + '）</h4><div class="tlist">' + (list || '<p class="note">尚無公告。</p>') + '</div>');
  bindTTabs();
  if ($('#aCancel')) $('#aCancel').onclick = function () { S.annEdit = null; drawAnn(); };
  $('#aSave').onclick = function () {
    var btn = this, a = { id: e.id || '', title: $('#aTitle').value.trim(), body: $('#aBody').value, to: $('#aTo').value.trim() || '全部',
      due: $('#aDue').value.replace(/-/g, '/'), pin: $('#aPin').checked, chs: $$('#aChs input:checked').map(function (x) { return +x.value; }) };
    if (!a.title) { toast('請填標題'); return; }
    btn.disabled = true;
    call('apiTeacherSaveAnn', S.teacher, a).then(function (r) { d.anns = r; S.annEdit = null; toast('已' + (a.id ? '儲存' : '發布')); drawAnn(); }).catch(function (er) { btn.disabled = false; fail(er); });
  };
  $$('[data-ea]').forEach(function (b) { b.onclick = function () { S.annEdit = d.anns.filter(function (a) { return a.id === b.dataset.ea; })[0]; drawAnn(); window.scrollTo(0, 0); }; });
  $$('[data-da]').forEach(function (b) {
    b.onclick = function () {
      modal('<h3>刪除這則公告？</h3><div class="mbtns"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="okDel">刪除</button></div>');
      $('#okDel').onclick = function () { this.disabled = true; call('apiTeacherDelAnn', S.teacher, b.dataset.da).then(function (r) { d.anns = r; closeModal(); drawAnn(); }).catch(fail); };
    };
  });
}

/* ---------- 教師：題庫管理 ---------- */
function drawQB() {
  var d = S.tdata, ch = S.qbCh || S.tCh || (d.chapters[0] && d.chapters[0].ch) || 1;
  S.qbCh = ch;
  if (!S.qb || S.qb.ch !== ch) {
    view(tTabs() + '<div class="loading">翻閱題庫</div>'); bindTTabs();
    return call('apiTeacherQs', S.teacher, ch).then(function (r) { S.qb = r; S.qEdit = null; drawQB(); }).catch(fail);
  }
  var Q = S.qb, e = S.qEdit || { type: '文意理解', opts: ['', '', '', ''], ans: '' };
  var chopt = d.chapters.map(function (c) { return '<option value="' + c.ch + '"' + (c.ch === ch ? ' selected' : '') + '>' + esc(c.num) + '　' + esc(c.title) + '</option>'; }).join('');
  var list = Q.qs.map(function (q, i) {
    return '<div class="scrollpanel titem"><div><b>第' + cnum(i + 1) + '題</b>　<span class="tag ' + typeCls(q.type) + '">' + esc(q.type) + '</span><span class="note">　題號 ' + q.no + (q.para ? '・對應第 ' + q.para + ' 段' : '') + '</span>' +
      '<div style="margin-top:6px;line-height:1.7">' + esc(q.stem) + '</div><div class="meta">' + q.opts.map(function (o, k) { return ('ABCD'[k] === q.ans ? '✔' : '') + 'ABCD'[k] + '. ' + esc(o); }).join('　') + '</div></div>' +
      '<div class="acts"><button class="btn ghost" data-eq="' + q.no + '">編輯</button><button class="btn ghost" data-dq="' + q.no + '">刪除</button></div></div>';
  }).join('');
  view(tTabs() + '<div class="homehead"><div><h2>題庫管理</h2><p>新增、修改或刪除題目，學生端立即生效。已交卷的學生，舊成績不會重算；修改後重新作答才會依新題目計分。</p></div></div>' +
    '<div class="tctrl"><select id="qbCh">' + chopt + '</select><span class="note">本回共 ' + Q.qs.length + ' 題・原文 ' + Q.nParas + ' 段</span></div>' +
    '<h4 class="sec">' + (e.no ? '編輯題號 ' + e.no : '新增題目') + '</h4><div class="scrollpanel tform">' +
    '<div class="row"><label>類型<select id="qType">' + ['文意理解', '人物', '概念', '劇情', '意象', '修辭'].map(function (t) { return '<option' + (e.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label>' +
    '<label>對應原文段落（1～' + Q.nParas + '，選填）<input type="number" id="qPara" min="1" max="' + Q.nParas + '" value="' + (e.para || '') + '"></label></div>' +
    '<label>題幹<textarea id="qStem">' + esc(e.stem || '') + '</textarea></label>' +
    '<label>選項（點左邊字母設為正確答案）<div class="opt4">' + [0, 1, 2, 3].map(function (k) {
      var L = 'ABCD'[k]; return '<span class="ansr"><label><input type="radio" name="qAns" value="' + L + '"' + (e.ans === L ? ' checked' : '') + '>' + L + '</label></span><input type="text" class="qOpt" value="' + esc(e.opts[k] || '') + '">'; }).join('') + '</div></label>' +
    '<label>解析<textarea id="qExp">' + esc(e.exp || '') + '</textarea></label>' +
    '<div class="mbtns" style="justify-content:flex-start">' + (e.no ? '<button class="btn ghost" id="qCancel">取消編輯</button>' : '') + '<button class="btn" id="qSave">' + (e.no ? '儲存修改' : '新增題目') + '</button></div></div>' +
    '<h4 class="sec">' + esc(Q.num) + '　' + esc(Q.title) + '</h4><div class="tlist">' + (list || '<p class="note">本回還沒有題目。</p>') + '</div>');
  bindTTabs();
  $('#qbCh').onchange = function () { S.qbCh = +this.value; S.qb = null; drawQB(); };
  if ($('#qCancel')) $('#qCancel').onclick = function () { S.qEdit = null; drawQB(); };
  $('#qSave').onclick = function () {
    var btn = this, a = $('input[name="qAns"]:checked');
    var q = { ch: ch, no: e.no || 0, type: $('#qType').value, para: +$('#qPara').value || '', stem: $('#qStem').value.trim(),
      opts: $$('.qOpt').map(function (x) { return x.value.trim(); }), ans: a ? a.value : '', exp: $('#qExp').value.trim() };
    if (!q.stem) return toast('請填題幹');
    if (q.opts.some(function (o) { return !o; })) return toast('四個選項都要填');
    if (!q.ans) return toast('請點選正確答案');
    btn.disabled = true;
    call('apiTeacherSaveQ', S.teacher, q).then(function (r) { S.qb = r; S.qEdit = null; S.tStale = true; toast(q.no ? '已儲存' : '已新增'); drawQB(); }).catch(function (er) { btn.disabled = false; fail(er); });
  };
  $$('[data-eq]').forEach(function (b) { b.onclick = function () { S.qEdit = JSON.parse(JSON.stringify(Q.qs.filter(function (q) { return q.no === +b.dataset.eq; })[0])); drawQB(); window.scrollTo(0, 0); }; });
  $$('[data-dq]').forEach(function (b) {
    b.onclick = function () {
      modal('<h3>刪除這一題？</h3><p>學生在這題的舊作答紀錄會保留在試算表，但不再計分。</p><div class="mbtns"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="okDel">刪除</button></div>');
      $('#okDel').onclick = function () { this.disabled = true; call('apiTeacherDelQ', S.teacher, ch, +b.dataset.dq).then(function (r) { S.qb = r; S.tStale = true; closeModal(); drawQB(); }).catch(fail); };
    };
  });
}

function nAns(v, c) {
  var n = v && v.lastAns ? Object.keys(v.lastAns).filter(function (k) { return String(v.lastAns[k] || '').trim(); }).length : 0;
  return n || (c && (c.qn || c.qs.length)) || 5;
}
function qStats(studs, ch, idx) {
  var o = {};
  studs.forEach(function (s) {
    var v = (idx[s.account.toLowerCase()] || {})[ch]; if (!v || !v.submitted || !v.lastAns) return;
    var chap = S.tdata.chapters.filter(function (c) { return c.ch === ch; })[0]; if (!chap) return;
    chap.qs.forEach(function (q) {
      var a = String(v.lastAns[q.no] || '').toUpperCase(); if (!a) return;   // 沒被抽到的題不計
      var st = o[q.no] = o[q.no] || { n: 0, ok: 0, pick: {} };
      st.n++; if (a === q.ans) st.ok++; st.pick[a] = (st.pick[a] || 0) + 1;
    });
  });
  return o;
}
function studentDetail(acc) {
  var s = S.tdata.roster.filter(function (r) { return r.account === acc; })[0], m = tIndex()[acc.toLowerCase()] || {};
  var html = '<h3>' + esc(s.cls) + ' ' + esc(s.seat) + ' ' + esc(s.name) + '</h3><p class="note">帳號 ' + esc(s.account) + '・' + esc(s.kind) + (s.school ? '・' + esc(s.school) : '') + '・最近登入 ' + esc(s.last || '—') + '</p>';
  html += S.tdata.chapters.map(function (c) {
    var v = m[c.ch];
    if (!v || !v.submitted) return '<p><b>' + esc(c.num) + '</b>　' + (v ? '已開始、未交卷（用時 ' + fmtDur(v.spent) + (v.opened ? '，開始於 ' + esc(v.opened) : '') + '）' : '未作答') + '</p>';
    var row = c.qs.filter(function (q) { return String((v.lastAns || {})[q.no] || ''); }).map(function (q) { var a = String((v.lastAns || {})[q.no] || ''); return '<span class="sc ' + (a === q.ans ? 'sc5' : 'sc1') + '" title="正解 ' + q.ans + '">' + cnum(q.no) + '：' + (a || '—') + '</span>'; }).join(' ');
    return '<p><b>' + esc(c.num) + '</b>　首次 ' + v.first + '・最高 ' + v.best + '・最近 ' + v.last + '（' + v.tries + ' 次）<br>' + row + '<br><small class="note">開始 ' + esc(v.opened || '—') + '・首次交卷 ' + esc(v.firstTime || '—') + '・最近交卷 ' + esc(v.lastTime) + '・累計用時 ' + fmtDur(v.spent) + '</small></p>';
  }).join('');
  modal(html + '<div class="mbtns"><button class="btn" onclick="closeModal()">關閉</button></div>');
}
function exportSheets() {
  var d = S.tdata, cls = S.tCls, studs = studentsOf(cls), idx = tIndex();
  var h1 = ['班級', '座號', '姓名', '帳號', '身分', '學校'];
  d.chapters.forEach(function (c) { h1.push(c.num + '首次', c.num + '最高', c.num + '次數', c.num + '首次交卷時間', c.num + '最近交卷時間', c.num + '用時（分）'); });
  h1.push('完成回數', '最高分總和');
  var r1 = [h1], r2 = [['班級', '座號', '姓名', '帳號', '回', '題號', '類型', '學生作答（最近）', '正確答案', '對錯', '首次得分', '最高得分', '作答次數', '開始時間', '首次交卷時間', '最近交卷時間', '累計用時（分）']];
  studs.forEach(function (s) {
    var m = idx[s.account.toLowerCase()] || {}, row = [s.cls, s.seat, s.name, s.account, s.kind, s.school], n = 0, tot = 0;
    d.chapters.forEach(function (c) {
      var v = m[c.ch];
      if (v && v.submitted) {
        n++; tot += v.best; row.push(v.first, v.best, v.tries, v.firstTime, v.lastTime, mins(v.spent));
        c.qs.forEach(function (q) { var a = String((v.lastAns || {})[q.no] || ''); if (!a) return; r2.push([s.cls, s.seat, s.name, s.account, c.num, q.no, q.type, a, q.ans, a === q.ans ? '○' : '×', v.first, v.best, v.tries, v.opened || '', v.firstTime, v.lastTime, mins(v.spent)]); });
      } else row.push(v ? '未交卷' : '', '', '', '', '', v ? mins(v.spent) : '');
    });
    row.push(n, tot); r1.push(row);
  });
  var r3 = [['回', '題號', '類型', '題幹', '正確答案', '作答人數', '答對人數', '答對率', '選A', '選B', '選C', '選D']];
  d.chapters.forEach(function (c) {
    var st = qStats(studs, c.ch, idx);
    c.qs.forEach(function (q) { var x = st[q.no] || { n: 0, ok: 0, pick: {} }; r3.push([c.num, q.no, q.type, q.stem, q.ans, x.n, x.ok, x.n ? Math.round(x.ok / x.n * 1000) / 10 + '%' : '', x.pick.A || 0, x.pick.B || 0, x.pick.C || 0, x.pick.D || 0]); });
  });
  var name = '三國演義閱讀檢測_' + (cls === '__all' ? '全部班級' : cls.replace(/[\\\/:*?"<>|【】]/g, '')) + '_' + d.time.slice(0, 10).replace(/\//g, '');
  return { name: name, sheets: [{ name: '班級總表', rows: r1 }, { name: '作答明細', rows: r2 }, { name: '各題答對率', rows: r3 }] };
}
function downloadXlsx() {
  var x = exportSheets();
  if (typeof XLSX === 'undefined') { toast('Excel 元件載入失敗，改用雲端硬碟匯出'); return exportDrive(); }
  try {
    var wb = XLSX.utils.book_new();
    x.sheets.forEach(function (s) {
      var ws = XLSX.utils.aoa_to_sheet(s.rows);
      ws['!cols'] = s.rows[0].map(function (h, i) { return { wch: s.name === '各題答對率' && i === 3 ? 60 : Math.max(6, String(h).length * 2 + 2) }; });
      XLSX.utils.book_append_sheet(wb, ws, s.name);
    });
    var buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    var url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    var a = document.createElement('a'); a.href = url; a.download = x.name + '.xlsx'; a.target = '_self'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('已下載 ' + x.name + '.xlsx');
  } catch (e) { toast('瀏覽器擋下下載，改用雲端硬碟匯出'); exportDrive(); }
}
function exportDrive() {
  var x = exportSheets(); toast('正在雲端硬碟建立檔案…', 4000);
  call('apiTeacherExportDrive', S.teacher, x.sheets, x.name).then(function (r) {
    modal('<h3>匯出完成</h3><p>檔案已存到你的雲端硬碟。</p><div class="mbtns"><a class="btn ghost" href="' + esc(r.sheetUrl) + '" target="_blank">開啟試算表</a><a class="btn" href="' + esc(r.url) + '" target="_blank">下載 xlsx</a></div>');
  }).catch(fail);
}
</script>
