/* 戰況面板、閱讀進度與遊戲機制（找依據、預測）、閱讀版面。本檔是純 JavaScript，由 Index.html 的 include() 併入同一個 <script>。

/** 依段落與段內位置，排出整回的戰況時間軸 */
function bfPrepare(d) {

}

  if (name) for (var i = 0; i < F.length; i++) if (F[i].name === name) return F[i];
  for (var j = 0; j < F.length; j++) if (F[j].keys.some(function (k) { return k && hay.indexOf(k) >= 0; })) return F[j];
  return F.filter(function (f) { return f.name === '群雄'; })[0] || { name: '群雄', c1: '#8a7a6a', c2: '#5a4a3a', keys: [] };

}
/** 人物造型 → 像素引擎 spec */

  return { pal: { h: L.hair || '#2a2a30', p: L.plume || fac.c1, a: L.armor || fac.c1, c: L.cloth || fac.c2, s: L.skin || '#f0c29a', d: L.beardC || '#1b1620' },

/* ================= 戰況面板 ================= */

/** 跳到某一幕：手動模式直接切換；有原文時捲到該幕的起點 */

/* ================= 閱讀位置：目前讀到第幾段、段內幾成 ================= */
function readLine() {
  var tx = $('#txt'); if (!tx || tx.offsetParent === null) return null;
  var ps = S.paraEls || $$('#txt p[data-i]'), mobile = window.innerWidth <= 900, vert = tx.classList.contains('vert'), cur = 0, frac = 0, line;
  if (!ps.length) return null;

/** 依閱讀位置決定目前戰況（往回捲會跟著倒退）；沒有顯示原文時改由「上一幕／下一幕」手動切換 */

}
/** 捲動時：更新進度條、讀到的最遠段落、戰況 */

    var bar = $('#rprog i'); if (bar) { var v = $('#txt').offsetParent === null ? (S.lastPos || 0) : readPos(); bar.style.width = Math.round(v * 100) + '%'; $('#rprog').title = '已讀約 ' + Math.round(v * 100) + '%'; }
    bfUpdate();

}

/* 遊戲進度存檔（讀到的段落、找到的依據、預測）：學生存在帳號，訪客存在這台裝置 */
