/* 戰況面板與閱讀版面。本檔是純 JavaScript，由 Index.html 的 include() 併入同一個 <script>。 */
var BF_ST = { '佔優': 'win', '相持': 'even', '潰敗': 'lose' };

  return '<div class="inf ' + role + ' ' + (BF_ST[sd.state] || 'even') + '"><div class="nm"><b>' + esc(u) + '</b><small>' + esc(sd.state || '') + '</small></div><div class="ub"><i data-w="' + pct + '" style="width:' + p0 + '%"></i></div></div>';
}
function bfSprite(u, sd, role) {

}
function bfPose(c, fr, ms) {

  setTimeout(function () { if (c.isConnected) { c._fr = S.bfFr || 0; PX.drawUnit(c, c._spec, c._fr); } }, ms);
}
function bfAnimStart() {

    var box = $('#bf'); if (!box) { clearInterval(S.bfAnim); S.bfAnim = 0; return; }

function bfRender(row, prev, box) {

    $$('.ub i', box).forEach(function (i) { i.style.width = i.dataset.w + '%'; });

      [['a', 'a'], ['b', 'b']].forEach(function (k) {
        if (prev[k[0]].state === row[k[0]].state) return;
        var st = row[k[0]].state;
        $$('.sp.' + k[1] + ' canvas.spx', box).forEach(function (c) {

/** 依閱讀位置決定目前戰況（往回捲會跟著倒退）；沒有顯示原文時改由「上一幕／下一幕」手動切換 */
function bfUpdate() {
  var B = S.bfs; if (!B || !B.rows.length) return;
  var tx = $('#txt'), pick = null;
  if (B.manual) pick = B.rows[Math.max(0, Math.min(B.rows.length - 1, B.idx || 0))];
  else {
    if (!tx || tx.offsetParent === null) return;
    var mobile = window.innerWidth <= 900, vert = tx.classList.contains('vert'), ps = B.ps, cur = 0, frac = 0, line;
    if (!ps.length) return;
    if (vert) {
      var r0 = tx.getBoundingClientRect(); line = r0.right - r0.width * .2;
      for (var k = 0; k < ps.length; k++) { var q = ps[k].getBoundingClientRect(); if (q.right >= line) { cur = k; frac = Math.min(1, Math.max(0, (q.right - line) / Math.max(1, q.width))); } else break; }
    } else {
      var rr = mobile ? { top: 0, height: innerHeight } : tx.getBoundingClientRect(); line = rr.top + (mobile ? (topH() + ($('#bf') ? $('#bf').offsetHeight : 0) + innerHeight * .25) : rr.height * .3);
      for (var k2 = 0; k2 < ps.length; k2++) { var q2 = ps[k2].getBoundingClientRect(); if (q2.top <= line) { cur = k2; frac = Math.min(1, Math.max(0, (line - q2.top) / Math.max(1, q2.height))); } else break; }
    }
    var idx = +ps[cur].dataset.i;
    B.rows.forEach(function (r) { if (r.para < idx || (r.para === idx && r.at <= frac + 1e-6)) pick = r; });
    if (S.demoPos != null) pick = B.rows[S.demoPos] || pick;
  }
  if (pick === B.cur) return;
  var prev = B.cur; B.cur = pick; var box = $('#bf'); if (!box) return;
  if (!pick) { box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = ''; bfRender(pick, prev, box);
}
function bfInit(d) {
  var box = $('#bf'); S.bfs = null; S.demoPos = null;
  if (!box) return;
  var rows = bfPrepare(d); if (!rows.length) { box.style.display = 'none'; return; }

  var tick = function () { if (S.bfTick) return; S.bfTick = requestAnimationFrame(function () { S.bfTick = 0; bfUpdate(); }); };
  $('#txt').addEventListener('scroll', tick); window.addEventListener('scroll', tick, { passive: true }); window.addEventListener('resize', function () { document.documentElement.style.setProperty('--topH', topH() + 'px'); tick(); });
}
/* ================= 閱讀版面：原文／戰況畫面／閱讀檢測，三項自由選搭 ================= */
function viewState() {
  var V = PREF.view, v = { txt: !!V.txt, bf: !!(V.bf && S.bfs), quiz: !!V.quiz };

}
