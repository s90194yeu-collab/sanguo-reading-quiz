    view('<div class="scrollpanel drill" style="text-align:center"><h3 style="font:700 26px var(--f-title);letter-spacing:6px;margin:0 0 10px">重練結束</h3>' +
      '<div class="bigseal" style="margin:10px auto">' + D.right + '/' + n + '<small>' + (D.right === n ? '全對' : D.right >= n * .6 ? '可也' : '再讀') + '</small></div>' +
      '<p>' + (D.right ? '答對的 ' + D.right + ' 題已自動訂正。' : '') + (n - D.right ? '答錯的 ' + (n - D.right) + ' 題留在錯題本，建議回原文再讀一次。' : '') + '</p>' +
      '<div class="mbtns" style="justify-content:center"><button class="btn ghost" id="dBook">回錯題本</button>' + ((S.mist || []).some(function (m) { return !fixedSet()[m.ch + '-' + m.no]; }) ? '<button class="btn" id="dAgain">再練一輪</button>' : '') + '</div></div>');
    $('#dBook').onclick = function () { renderMistakes(); };
    if ($('#dAgain')) $('#dAgain').onclick = startDrill;
    Qin.sfx(D.right === n ? 'bell' : 'gong');
    return;
  }
  var it = D.qs[D.i], m = it.m;
  view('<div class="scrollpanel drill"><div class="dp"><span>錯題重練・第 ' + (D.i + 1) + '／' + n + ' 題</span><span>答對 ' + D.right + '</span></div><div class="dbar"><div style="width:' + (D.i / n * 100) + '%"></div></div>' +
    '<div class="qh"><span class="chno sm">' + esc(m.num) + '</span><span class="tag ' + typeCls(m.type) + '">' + esc(m.type) + '</span></div><p class="stem">' + esc(m.stem) + '</p>' +
    '<div class="opts">' + it.order.map(function (o, i) { return '<label class="opt" data-l="' + 'ABCD'[o] + '"><span class="L">' + 'ABCD'[i] + '</span><span>' + esc(m.opts[o]) + '</span></label>'; }).join('') + '</div>' +
    '<div class="fb"></div><div class="mbtns"><button class="btn ghost" id="dQuit">結束重練</button><button class="btn hidden" id="dNext">' + (D.i + 1 < n ? '下一題' : '看結果') + '</button></div></div>');
  $('#dQuit').onclick = function () { renderMistakes(); };
  $('#dNext').onclick = function () { D.i++; renderDrill(); };
  $$('.opt').forEach(function (o) {
    o.onclick = function () {
      if (D.answered === D.i) return; D.answered = D.i;
      var ok = o.dataset.l === m.ans, fb = $('.fb');
      $('.opt[data-l="' + m.ans + '"]').classList.add('right'); if (!ok) o.classList.add('wrong');
      fb.className = 'fb show'; fb.innerHTML = '<span class="verdict ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ 答對，已訂正' : '答錯了') + '</span>' + (m.exp ? '<div>' + esc(m.exp) + '</div>' : '') + (ok ? '' : '<div class="note">這題會留在錯題本。原文在' + esc(m.num) + '第 ' + m.para + ' 段。</div>');
      if (ok) { D.right++; markFixed([m]); Qin.sfx('bell'); } else Qin.sfx('wood');
      $('#dNext').classList.remove('hidden');
    };
  });
}
