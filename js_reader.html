/* 氣泡尾巴：依氣泡實際大小，從最近的邊畫向指定位置（百分比座標） */
function layoutBubbles(root) {
  (root || document).querySelectorAll('.panel').forEach(function (p) {
    var W = p.clientWidth, H = p.clientHeight; if (!W || !H) return;
    var svg = p.querySelector('.tails'), out = '';
    p.querySelectorAll('.bub').forEach(function (b) {
      b.style.top = b.dataset.y0 || (b.dataset.y0 = b.style.top); b.style.left = b.dataset.x0 || (b.dataset.x0 = b.style.left);
      if (b.offsetTop + b.offsetHeight > H - 2) b.style.top = Math.max(2, H - 2 - b.offsetHeight) + 'px';
      if (b.offsetLeft + b.offsetWidth > W - 2) b.style.left = Math.max(2, W - 2 - b.offsetWidth) + 'px';
    });
    p.querySelectorAll('.bub').forEach(function (b) {
      var tx = +b.dataset.tx, ty = +b.dataset.ty;
      if (b.classList.contains('k-白') || (!tx && !ty)) return;
      var L = b.offsetLeft / W * 100, T = b.offsetTop / H * 100, w = b.offsetWidth / W * 100, h = b.offsetHeight / H * 100;
      var cx = L + w / 2, cy = T + h / 2, bx, by, ax, ay, bw = Math.min(4.2, w * 0.28);
      var below = ty > T + h, above = ty < T;
      if (below || above) { by = below ? T + h - 1.2 : T + 1.2; bx = Math.max(L + bw + 2, Math.min(L + w - bw - 2, (cx + tx) / 2)); ax = bx - bw; ay = by; var cxp = bx + bw, cyp = by; out += pathT(ax, ay, cxp, cyp, tx, ty, b); }
      else { bx = tx < L ? L + 1.2 : L + w - 1.2; by = Math.max(T + 3, Math.min(T + h - 3, ty)); out += pathT(bx, by - 2.2, bx, by + 2.2, tx, ty, b); }
    });
    svg.innerHTML = out;
  });
}
function pathT(x1, y1, x2, y2, tx, ty, b) {
  if (b.classList.contains('k-想')) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    return [[.62, 1.5], [.34, 1.0], [.12, .6]].map(function (q) { return '<ellipse cx="' + (mx + (tx - mx) * q[0]) + '" cy="' + (my + (ty - my) * q[0]) + '" rx="' + q[1] + '" ry="' + (q[1] * 1.7) + '" fill="#f6f1ff" stroke="#2a1d12" stroke-width=".35"/>'; }).join('');
  }
  return '<polygon points="' + x1 + ',' + y1 + ' ' + x2 + ',' + y2 + ' ' + tx + ',' + ty + '" fill="#fffaf0" stroke="#2a1d12" stroke-width=".4" stroke-linejoin="round"/>';
}
function sourceHTML(s) {
  if (!s) return '';
  function lk(x) { return !x ? '' : x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.text) + '</a>' : esc(x.text); }
  var parts = [];
  if (s.base) parts.push('底本：' + lk(s.base));
  if (s.ref) parts.push('參校：' + lk(s.ref));
  if (s.note) parts.push(esc(s.note));
  return parts.length ? '<div class="source">【出處】' + parts.join('；') + '</div>' : '';
}
/* ================= 註釋與人物小卡 ================= */
function buildMarkup(d) {
  var map = {}, put = function (k, t, v) { if (!k) return; (map[k] = map[k] || {})[t] = v; };
  (d.names || []).forEach(function (n) { if (n.w && n.w.length >= 2) put(n.w, 'k', n); });
  (d.people || []).forEach(function (p) { [p.name].concat(p.alias || []).forEach(function (k) { if (k && !(map[k] && map[k].p)) put(k, 'p', p); }); });
  (d.notes || []).forEach(function (n) { put(n.w, 'n', n); });
  var keys = Object.keys(map).sort(function (a, b) { return b.length - a.length; });
  S.noteMap = {}; S.peopleMap = {}; S.nameMap = {};
  (d.notes || []).forEach(function (n) { S.noteMap[n.w] = n; });
  (d.people || []).forEach(function (p) { S.peopleMap[p.name] = p; });
  (d.names || []).forEach(function (n) { S.nameMap[n.w] = n; });
  return { re: keys.length ? new RegExp(keys.map(function (k) { return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g') : null, map: map, used: {} };
}
function markup(html, mk) {

  return html.replace(mk.re, function (m) {

    if (x.p) return '<span class="ps zm" data-n="' + esc(x.p.name) + '">' + m + '</span>';
    if (x.k) return '<span class="zm' + (x.k.k === '書名' ? ' bk' : '') + (x.k.note ? ' pk' : '') + '" data-k="' + m + '">' + m + '</span>';
    return m;
  });
}

/* ================= 進度與成就 ================= */

  { id: 'peach', name: '桃園之義', seal: '桃園', tip: '第一回全對', test: function (c) { return c.perfect[1]; } },
  { id: 'ace', name: '百步穿楊', seal: '穿楊', tip: '任一回全對', test: function (c) { return c.nPerfect >= 1; } },
  { id: 'three', name: '三英聚首', seal: '三英', tip: '三回全對', test: function (c) { return c.nPerfect >= 3; } },
  { id: 'wine', name: '溫酒斬將', seal: '斬將', tip: '第五回全對', test: function (c) { return c.perfect[5]; } },
  { id: 'five', name: '過關斬將', seal: '過關', tip: '連續完成第一到第五回', test: function (c) { return c.streak >= 5; } },

  { id: 'all', name: '手不釋卷', seal: '釋卷', tip: '完成所有開放的回目', test: function (c) { return c.total > 0 && c.done >= c.total; } }

function fixedKey() { return 'sg_fixed_' + (S.user ? S.user.account : 'guest'); }
function fixedSet() { try { return JSON.parse(store(fixedKey()) || '{}'); } catch (e) { return {}; } }
function achCtx(h) {
  var c = { done: 0, perfect: {}, nPerfect: 0, streak: 0, fixed: Object.keys(fixedSet()).length, total: h.chapters.length };
  h.chapters.forEach(function (ch) {
    var p = h.progress[ch.ch];
    if (p && p.submitted) { c.done++; if (p.best >= ch.qn && ch.qn) { c.perfect[ch.ch] = true; c.nPerfect++; } }
  });
  for (var i = 1; h.progress[i] && h.progress[i].submitted; i++) c.streak = i;
  return c;
}
function progressHTML(h) {
  if (S.guest) return '<div class="progress scrollpanel"><p class="note" style="margin:0">登入後可記錄閱讀進度、收集成就印章，並使用錯題本。</p></div>';
  var c = achCtx(h), TOTAL = 120;
  var nodes = h.chapters.map(function (ch) {
    var p = h.progress[ch.ch] || {}, cls = p.submitted ? (c.perfect[ch.ch] ? 'done perfect' : 'done') : p.hasDraft ? 'draft' : '';
    return '<span class="node ' + cls + '" title="' + esc(ch.num + ' ' + ch.title) + '">' + cnum(ch.ch) + '</span>';
  }).join('<i></i>');
  var achs = ACH.map(function (a) {
    var ok = a.test(c);
    return '<div class="ach' + (ok ? ' got' : '') + '" data-tip="' + esc(a.name + '：' + a.tip + (ok ? '（已獲得）' : '（尚未獲得）')) + '"><span class="seal2">' + a.seal + '</span><small>' + a.name + '</small></div>';
  }).join('');
  var got = ACH.filter(function (a) { return a.test(c); }).length;
  return '<div class="progress scrollpanel"><div class="pg-top"><b>閱讀進度</b><span>已讀 ' + c.done + ' 回／開放 ' + c.total + ' 回・全書 ' + TOTAL + ' 回</span></div>' +
    '<div class="pg-bar"><div style="width:' + (c.done / TOTAL * 100).toFixed(2) + '%"></div></div>' +
    '<div class="pg-nodes">' + nodes + '</div>' +
    '<div class="pg-top" style="margin-top:14px"><b>成就印章</b><span>' + got + '／' + ACH.length + '</span></div><div class="achs">' + achs + '</div></div>';

function checkNewAch(h) {
  if (S.guest || !S.user) return;
  var key = 'sg_ach_' + S.user.account, c = achCtx(h), now = ACH.filter(function (a) { return a.test(c); }).map(function (a) { return a.id; });
  var old = store(key);
  store(key, JSON.stringify(now));
  if (old === null) return;
  try { old = JSON.parse(old); } catch (e) { old = []; }
  var fresh = ACH.filter(function (a) { return now.indexOf(a.id) >= 0 && old.indexOf(a.id) < 0; });
  if (fresh.length) { Qin.sfx('bell'); toast('獲得印章：' + fresh.map(function (a) { return a.name; }).join('、'), 3200); }
}

/* ================= 錯題本 ================= */
function openMistakes() {
  flushDraft();
  loading('翻開錯題本');
  call('apiMistakes', S.token).then(function (list) { S.mist = list; var f = fixedSet(), add = []; list.forEach(function (m) { var k = m.ch + '-' + m.no; if (m.fixed) f[k] = 1; else if (f[k]) add.push(m); }); store(fixedKey(), JSON.stringify(f)); if (add.length) markFixed(add); S.mistFilter = S.mistFilter || 'todo'; renderMistakes(); }).catch(fail);
}
function renderMistakes() {
  var fx = fixedSet(), all = S.mist || [];
  var list = all.filter(function (m) { return S.mistFilter === 'all' || !fx[m.ch + '-' + m.no]; });
  var nFixed = all.filter(function (m) { return fx[m.ch + '-' + m.no]; }).length;
  var body = list.length ? list.map(function (m) {
    var k = m.ch + '-' + m.no, done = !!fx[k];
    return '<div class="mq scrollpanel' + (done ? ' fixed' : '') + '" data-k="' + k + '"><div class="qh"><span class="chno sm">' + esc(m.num) + '</span><span class="qn">第' + cnum(m.no) + '題</span>' +
      '<span class="tag ' + typeCls(m.type) + '">' + esc(m.type) + '</span>' + (done ? '<span class="okmark">已訂正</span>' : '') + '</div>' +
      '<p class="stem">' + esc(m.stem) + '</p><div class="opts">' + m.opts.map(function (o, i) {
        return '<label class="opt" data-l="' + 'ABCD'[i] + '"><span class="L">' + 'ABCD'[i] + '</span><span>' + esc(o) + '</span></label>'; }).join('') + '</div>' +
      '<div class="fb"></div><div class="mbar"><span class="note">上次你選 ' + (m.mine || '—') + '</span><button class="link" data-go="' + m.ch + '" data-para="' + m.para + '">回原文第 ' + m.para + ' 段</button></div></div>';
  }).join('') : '<div class="scrollpanel" style="text-align:center;padding:40px"><p style="font:20px var(--f-title)">' + (all.length ? '錯題都訂正完了，了不起！' : '目前沒有錯題。交卷後答錯的題目會收進這裡。') + '</p></div>';
  view('<div class="homehead"><div><h2>錯題本</h2><p>重新作答答錯過的題目，答對就算訂正。共 ' + all.length + ' 題，已訂正 ' + nFixed + ' 題。</p></div>' +
    '<div class="rtools">' + (all.length - nFixed ? '<button class="btn" id="mDrill" style="padding:6px 16px;font-size:16px">錯題重練（' + Math.min(10, all.length - nFixed) + ' 題）</button>' : '') + '<button class="chip' + (S.mistFilter === 'todo' ? ' on' : '') + '" data-f="todo">未訂正</button><button class="chip' + (S.mistFilter === 'all' ? ' on' : '') + '" data-f="all">全部</button><button class="chip" id="mBack">回目錄</button></div></div>' +
    '<div class="mlist">' + body + '</div>');
  $$('[data-f]').forEach(function (b) { b.onclick = function () { S.mistFilter = b.dataset.f; renderMistakes(); }; });
  $('#mBack').onclick = goHome;
  if ($('#mDrill')) $('#mDrill').onclick = function () { Qin.sfx('wood'); startDrill(); };
  $$('.mq').forEach(function (box) {
    var m = all.filter(function (x) { return x.ch + '-' + x.no === box.dataset.k; })[0], tries = 0;
    $$('.opt', box).forEach(function (o) {
      o.onclick = function () {
        if (box.classList.contains('solved')) return;
        var L = o.dataset.l, fb = $('.fb', box);
        if (L === m.ans) {
          box.classList.add('solved'); o.classList.add('right'); Qin.sfx('bell');
          markFixed([m]);
          fb.className = 'fb show'; fb.innerHTML = '<span class="verdict ok">✓ 訂正成功</span>' + (m.exp ? '<div>' + esc(m.exp) + '</div>' : '');
          if (!$('.okmark', box)) $('.qh', box).insertAdjacentHTML('beforeend', '<span class="okmark">已訂正</span>');
        } else {
          tries++; o.classList.add('wrong'); Qin.sfx('wood');
          fb.className = 'fb show';
          if (tries >= 2) {
            box.classList.add('solved'); $('.opt[data-l="' + m.ans + '"]', box).classList.add('right');
            fb.innerHTML = '<span class="verdict no">正解是 ' + m.ans + '</span>' + (m.exp ? '<div>' + esc(m.exp) + '</div>' : '') + '<div class="note">建議回原文再讀一次，下次再來訂正。</div>';
          } else fb.innerHTML = '<span class="verdict no">再想想</span><div class="note">提示：回原文第 ' + m.para + ' 段找找線索。</div>';
        }
      };
    });
  });
  $$('[data-go]').forEach(function (b) { b.onclick = function () { S.pendingJump = +b.dataset.para; openChapter(+b.dataset.go); }; });
}


/* ================= 公告・必讀・班級挑戰 ================= */
function mustSet(h) { var o = {}; (h.ann || []).forEach(function (a) { a.chs.forEach(function (c) { o[c] = 1; }); }); return o; }
function chName(h, ch) { var c = (h.chapters || []).filter(function (x) { return x.ch === ch; })[0]; return c ? c.num : '第' + cnum(ch) + '回'; }
function annHTML(h) {
  if (S.guest || !h.ann || !h.ann.length) return '';
  return h.ann.map(function (a) {
    var chs = a.chs.map(function (c) {
      var done = h.progress[c] && h.progress[c].submitted;
      return '<button class="chip' + (done ? ' on' : '') + '" data-goch="' + c + '">' + esc(chName(h, c)) + (done ? '　✓ 已完成' : '') + '</button>';
    }).join('');
    return '<div class="ann scrollpanel' + (a.pin ? ' pin' : '') + '"><div class="ah"><b>' + (a.pin ? '<small>置頂</small>' : '') + esc(a.title) + '</b><span>' +
      (a.due ? '截止 ' + esc(a.due) : '') + '</span></div>' + (a.body ? '<p>' + esc(a.body).replace(/\n/g, '<br>') + '</p>' : '') +
      (chs ? '<div class="anch">必讀：' + chs + '</div>' : '') + '</div>';
  }).join('');
}
function boardHTML(h) {
  var b = h.board; if (S.guest || !b) return '';
  var c = b.challenge, pct = c.goal ? Math.min(100, c.done / c.goal * 100) : 0;
  var row = function (m) {
    return '<div class="rk' + (m.me ? ' me' : '') + '"><span class="no">' + m.rank + '</span><span class="nm">' + esc(m.name) + (m.me ? '（你）' : '') + '</span>' +
      '<span>完成 ' + m.done + ' 回</span><span>答對 ' + m.best + ' 題</span><span class="pf">' + (m.perfect ? '全對 ' + m.perfect + ' 回' : '') + '</span></div>';
  };
  var inTop = b.top.some(function (m) { return m.me; });
  return '<div class="board scrollpanel"><div class="pg-top"><b>班級挑戰・' + esc(b.cls) + '</b><span>全班已完成 ' + c.done + ' 回次／目標 ' + c.goal + ' 回次（' + b.n + ' 人，完成率 ' + c.target + '%）</span></div>' +
    '<div class="pg-bar"><div style="width:' + pct.toFixed(1) + '%;background:linear-gradient(90deg,var(--jade),var(--gold))"></div></div>' +
    (c.goal && c.done >= c.goal ? '<p class="goal">全班達標！再接再厲，挑戰全員讀完。</p>' : '<p class="goal" style="color:var(--mute)">還差 ' + Math.max(0, c.goal - c.done) + ' 回次達標，一起讀吧。</p>') +
    '<div class="pg-top" style="margin-top:14px"><b>排行榜</b><span>依完成回數、答對題數排序</span></div>' +
    '<div class="rank">' + (b.top.length ? b.top.map(row).join('') : '<p class="note">還沒有人交卷，搶頭香吧！</p>') +
    (!inTop && b.me ? '<div class="rk gap">⋯</div>' + row(b.me) : '') + '</div></div>';
}


function jumpPara(i) {
  var p = $('#txt p[data-i="' + i + '"]'); if (!p) return; if (p.parentNode.classList.contains('poemgrp')) p = p.parentNode;
  if (window.innerWidth <= 900) $('.mtabs .chip[data-p="txt"]').click();
  var tx = $('#txt');
  if (window.innerWidth > 900 && !tx.classList.contains('vert')) tx.scrollTo({ top: p.offsetTop - tx.clientHeight / 3, behavior: 'smooth' });
  else p.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  p.classList.add('flash'); setTimeout(function () { p.classList.remove('flash'); }, 2200);
}
function queueDraft() { clearTimeout(S.draftTimer); $('#savest') && ($('#savest').textContent = '研墨中…'); S.draftTimer = setTimeout(function () { saveDraft(false); }, 1200); }
function saveDraft(manual) {
  clearTimeout(S.draftTimer); S.draftTimer = null;
  if (!S.chap || (S.chap.result && (S.guest || S.spent === S.spentSaved))) return Promise.resolve();
  var ch = S.chap.ch;
  if (S.guest) {
    store('sg_guest_' + ch, JSON.stringify({ ans: S.ans, pos: readPos() })); S.posDirty = false;
    if ($('#savest')) $('#savest').textContent = '訪客模式：答案暫存在這台裝置';
    if (manual) toast('已暫存在這台裝置');
    return Promise.resolve();
  }
  var sp = S.spent || 0; S.saving = true;
  return call('apiSaveDraft', S.token, ch, S.ans, readPos(), S.bm || [], sp).then(function (r) {
    S.saving = false; if (S.chap && S.chap.ch === ch) S.spentSaved = sp;
    if (S.chap && S.chap.ch === ch && $('#savest')) $('#savest').textContent = '墨跡已乾・已存檔 ' + r.time.slice(11, 16);
    if (manual) toast('已存檔');
    S.posDirty = false;
  }).catch(function (e) { S.saving = false; if ($('#savest')) $('#savest').textContent = '存檔失敗，請檢查網路'; if (manual) fail(e); });
}
function flushDraft() {
  if (S.chap && (S.token || S.guest) && ((!S.chap.result && (S.draftTimer || S.posDirty)) || (S.token && S.spent !== S.spentSaved))) saveDraft(false);
}
window.addEventListener('beforeunload', flushDraft);
document.addEventListener('visibilitychange', function () { if (document.hidden) flushDraft(); });
